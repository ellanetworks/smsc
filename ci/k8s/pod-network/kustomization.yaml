apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../namespace
  - ../../../k8s
images:
  - name: ghcr.io/ellanetworks/ella-smsc
    newName: ella-smsc
    newTag: ci
patches:
  - patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: ella-smsc
      spec:
        type: NodePort
        externalTrafficPolicy: Local
  - patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: ella-smsc-diameter
      spec:
        type: NodePort
