# Ella SMSC configuration file.
# After modifying it, restart Ella SMSC with
# `sudo snap restart ella-smsc.smscd` for the changes to take effect.
logging:
  level: info
db:
  path: /var/snap/ella-smsc/common/smsc.db
api:
  address: 0.0.0.0
  port: 5010
  # Optional: serve over HTTPS.
  # tls:
  #   cert: /path/to/cert.pem
  #   key: /path/to/key.pem
diameter:
  address: 127.0.0.1
  port: 3868
