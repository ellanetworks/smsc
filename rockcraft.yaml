name: ella-smsc
base: bare
build-base: ubuntu@26.04
adopt-info: smsc-release-data
summary: Ella SMSC is a secure, reliable, and easy to operate SMS service center.
description: |
 Ella SMSC is a secure, reliable, and easy to operate SMS service center.
platforms:
  amd64:
  arm64:

services:
  ella-smsc:
    override: replace
    summary: Ella SMSC is a secure, reliable, and easy to operate SMS service center.
    command: smsc --config /smsc.yaml
    startup: enabled
    on-failure: restart

parts:
  core:
    plugin: go
    source: .
    source-type: local
    build-packages:
      - git
    build-snaps:
      - go/1.26/stable
      - node/24/stable
    stage-packages:
      - libc6_libs
    override-build: |
      npm ci --prefix ui
      npm run build --prefix ui
      REVISION=`git rev-parse HEAD`
      go build -v -o ${CRAFT_PART_INSTALL}/bin/smsc -ldflags "-s -w -X github.com/ellanetworks/smsc/version.GitCommit=${REVISION}" ./cmd/smsc

  smsc-release-data:
    plugin: nil
    source: .
    override-build: |
      version="$(cat version/VERSION)"
      craftctl set version="$version"
