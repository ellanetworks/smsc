name: Kubernetes Smoke Test

permissions:
  contents: read

on:
  workflow_call:

jobs:
  k8s-smoke:
    strategy:
      fail-fast: false
      matrix:
        mode: [multus, pod-network, ha]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      KIND_VERSION: v0.33.0
      KUBECTL_VERSION: v1.37.1
      HELM_VERSION: v4.3.1
      HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
    steps:
      - uses: actions/checkout@v7
        with:
          # The tags, to upgrade from the previous release.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      # The kind node shares the runner's kernel, so this makes SCTP available in the cluster.
      - name: Load SCTP
        run: sudo modprobe sctp

      - name: Install kind, kubectl and Helm
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          cd "${RUNNER_TEMP}/bin"
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -fsSL --retry 3 -o helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          printf '%s  %s\n' "${HELM_SHA256}" helm.tgz | sha256sum --check
          tar -xzf helm.tgz --strip-components 1 linux-amd64/helm
          rm helm.tgz
          chmod +x kind kubectl
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - uses: actions/download-artifact@v8
        with:
          name: ellasmsc-image-amd64

      - name: Load the image
        run: docker load -i ellasmsc_latest-amd64.tar

      - name: Find the previous release
        run: |
          version="$(cat version/VERSION)"
          previous="$(git tag --list 'v*' --merged HEAD --sort=-v:refname | grep -vxF "${version}" | grep -v '^v0\.0\.' | head -n 1 || true)"
          if [ -n "${previous}" ]; then
            echo "PREVIOUS_IMAGE=ghcr.io/ellanetworks/ella-smsc:${previous}-amd64" >> "${GITHUB_ENV}"
            echo "upgrading from ${previous}"
          else
            echo "no previous release to upgrade from"
          fi

      - name: Smoke test
        run: ci/k8s/smoke.sh
        env:
          MODE: ${{ matrix.mode }}
          IMAGE: ella-smsc:latest
