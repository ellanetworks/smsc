name: UI E2E

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ui-e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Download the image
        uses: actions/download-artifact@v8
        with:
          name: ellasmsc-image-amd64

      - name: Load the image
        run: |
          docker load -i ellasmsc_latest-amd64.tar

      - name: use npm
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm ci --prefix ui

      - name: Install Playwright browsers
        run: |
          npx --prefix ui playwright install --with-deps chromium

      # Diameter listens on SCTP.
      - name: Load the SCTP module
        run: |
          sudo modprobe sctp

      - name: Start Ella SMSC
        run: |
          ELLA_E2E_PORT=5110 docker compose -f ui/e2e/compose.yaml up -d
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:5110/api/v1/status; then
              echo "Ella SMSC is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Ella SMSC did not become ready in time"
          docker compose -f ui/e2e/compose.yaml logs
          exit 1

      - name: Run E2E tests
        env:
          ELLA_E2E_BASE_URL: http://localhost:5110
        run: |
          npm run test:e2e --prefix ui

      - name: Collect Ella SMSC logs
        if: failure()
        run: |
          docker compose -f ui/e2e/compose.yaml logs

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7

      - name: Stop Ella SMSC
        if: always()
        run: |
          ELLA_E2E_PORT=5110 docker compose -f ui/e2e/compose.yaml down -v
