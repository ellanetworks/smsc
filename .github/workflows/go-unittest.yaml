name: Go Unit Tests

permissions:
  contents: read

on:
  workflow_call:

jobs:
  go-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Load SCTP
        run: sudo modprobe sctp

      - name: Unit tests
        run: go test -cover ./...

      - name: Sub-module unit tests
        run: |
          set -e
          for modfile in $(find . -name go.mod -not -path './go.mod'); do
            dir=$(dirname "$modfile")
            echo "::group::go test ./... in $dir"
            (cd "$dir" && go test -cover ./...)
            echo "::endgroup::"
          done
