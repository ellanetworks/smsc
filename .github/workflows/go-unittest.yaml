name: Go Unit Tests

permissions:
  contents: read

on:
  workflow_call:

jobs:
  go-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Load SCTP
        run: sudo modprobe sctp

      - name: Install SoftHSM2
        run: sudo apt-get update && sudo apt-get install -y softhsm2

      - name: Unit tests
        env:
          SOFTHSM2_LIB: /usr/lib/softhsm/libsofthsm2.so
        run: go test -cover ./...

      - name: Sub-module unit tests
        run: |
          set -e
          for modfile in $(find . -name go.mod -not -path './go.mod' -not -path './ui/*'); do
            dir=$(dirname "$modfile")
            echo "::group::go test ./... in $dir"
            (cd "$dir" && go test -cover ./...)
            echo "::endgroup::"
          done

  go-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Load SCTP
        run: sudo modprobe sctp

      - name: Cluster integration tests
        run: go test -tags integration -count=1 -timeout 15m ./internal/integration
