# Ella SMSC on one node: Diameter listens on the pod's eth0 and is reached
# through the SCTP Service ella-smsc-diameter.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ella
resources:
  - base
  - smsc-diameter-service.yaml
configMapGenerator:
  - name: smsc-config
    files:
      - smsc.yaml
    options:
      labels:
        app.kubernetes.io/name: ella-smsc
        app.kubernetes.io/instance: ella-smsc
        app.kubernetes.io/part-of: ella
