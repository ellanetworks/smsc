apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ella-smsc
spec:
  replicas: 3
  template:
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: ella-smsc
                app.kubernetes.io/instance: ella-smsc
            topologyKey: kubernetes.io/hostname
      containers:
      - name: smsc
        volumeMounts:
        - name: cluster-secret
          mountPath: /secrets/cluster
          readOnly: true
      volumes:
      - name: cluster-secret
        secret:
          secretName: ella-smsc-cluster
          defaultMode: 0440
