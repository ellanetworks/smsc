apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ella-smsc
  labels:
    app.kubernetes.io/name: ella-smsc
    app.kubernetes.io/instance: ella-smsc
    app.kubernetes.io/part-of: ella
spec:
  replicas: 1
  serviceName: ella-smsc-internal
  # Start and replace pods without waiting for the others to be ready: a
  # survivor without a leader stays unready until the missing pods return.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: ella-smsc
      app.kubernetes.io/instance: ella-smsc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ella-smsc
        app.kubernetes.io/instance: ella-smsc
        app.kubernetes.io/part-of: ella
    spec:
      terminationGracePeriodSeconds: 50
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: smsc
        image: ghcr.io/ellanetworks/ella-smsc:latest
        command: ["smsc"]
        args: ["--config", "/config/smsc.yaml"]
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SMSC_DIAMETER_HOST_LABEL
          value: $(POD_NAME)
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - name: http
          containerPort: 5010
        - name: diameter
          containerPort: 3868
          protocol: SCTP
        - name: smpp
          containerPort: 2775
        - name: cluster
          containerPort: 7000
        startupProbe:
          httpGet:
            path: /api/v1/livez
            port: http
          periodSeconds: 2
          timeoutSeconds: 3
          failureThreshold: 150
        readinessProbe:
          httpGet:
            path: /api/v1/readyz
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/v1/livez
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        lifecycle:
          preStop:
            sleep:
              seconds: 5
        resources:
          requests:
            cpu: 500m
            memory: 256Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: config-volume
          mountPath: /config
          readOnly: true
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config-volume
        configMap:
          name: smsc-config
      - name: tmp
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
