apiVersion: v1
kind: Service
metadata:
  name: ella-smsc
  labels:
    app.kubernetes.io/name: ella-smsc
    app.kubernetes.io/instance: ella-smsc
    app.kubernetes.io/part-of: ella
spec:
  selector:
    app.kubernetes.io/name: ella-smsc
    app.kubernetes.io/instance: ella-smsc
  ports:
  - name: http
    protocol: TCP
    port: 5010
    targetPort: 5010
  # SMPP. The listener runs only with an smpp block in the ConfigMap. TLS, if
  # any, is terminated in the pod.
  - name: smpp
    protocol: TCP
    port: 2775
    targetPort: smpp
