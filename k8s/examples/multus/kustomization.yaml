apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ella
resources:
  - ../../base
  - smsc-diameter-nad.yaml
configMapGenerator:
  - name: smsc-config
    files:
      - smsc.yaml
    options:
      labels:
        app.kubernetes.io/name: ella-smsc
        app.kubernetes.io/instance: ella-smsc
        app.kubernetes.io/part-of: ella
patches:
  - patch: |
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: ella-smsc
      spec:
        template:
          metadata:
            annotations:
              k8s.v1.cni.cncf.io/networks: |
                [
                  {"name": "smsc-diameter", "interface": "diameter"}
                ]
