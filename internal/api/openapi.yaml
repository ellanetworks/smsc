openapi: "3.1.0"
info:
  title: Ella SMSC API
  version: "1.0.0"

servers:
  - url: "{scheme}://{host}"
    variables:
      scheme:
        default: http
        enum: [http, https]
      host:
        default: localhost:5010

security:
  - BearerAuth: []

tags:
  - name: Auth
  - name: Users
  - name: Messages
  - name: Operator
  - name: Diameter
  - name: Delivery
  - name: Status
  - name: Metrics
  - name: Profiling
  - name: Specification

paths:
  /api/v1/messages:
    post:
      tags: [Messages]
      operationId: createMessage
      summary: Create message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageParams"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/CreateMessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Messages]
      operationId: listMessages
      summary: List messages
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: to
          in: query
          schema:
            $ref: "#/components/schemas/E164"
        - name: from
          in: query
          schema:
            $ref: "#/components/schemas/Originator"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/MessageStatus"
        - name: start
          in: query
          description: Keeps the messages created at or after this time.
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          description: Keeps the messages created before this time. Must not be before start.
          schema:
            type: string
            format: date-time
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/ListMessagesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/messages/retention:
    get:
      tags: [Messages]
      operationId: getMessageRetention
      summary: Get message retention
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          $ref: "#/components/responses/RetentionSettings"
    put:
      tags: [Messages]
      operationId: updateMessageRetention
      summary: Update message retention
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionSettings"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          $ref: "#/components/responses/RetentionSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/messages/{id}:
    get:
      tags: [Messages]
      operationId: getMessage
      summary: Get message
      parameters:
        - $ref: "#/components/parameters/MessageID"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/messages/{id}/attempts:
    get:
      tags: [Messages]
      operationId: listMessageAttempts
      summary: List delivery attempts
      parameters:
        - $ref: "#/components/parameters/MessageID"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/ListAttemptsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/messages/{id}/content:
    get:
      tags: [Messages]
      operationId: getMessageContent
      summary: Get message content
      description: Each read logs an audit event.
      parameters:
        - $ref: "#/components/parameters/MessageID"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/MessageContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/diameter:
    get:
      tags: [Diameter]
      operationId: getDiameterStatus
      summary: Get Diameter status
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/DiameterStatus"

  /api/v1/diameter/peers:
    get:
      tags: [Diameter]
      operationId: listDiameterPeers
      summary: List Diameter peers
      description: The Diameter agents and nodes that the SMSC connects to, with their routes and connection status.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Peer"
    post:
      tags: [Diameter]
      operationId: createDiameterPeer
      summary: Create Diameter peer
      description: >-
        The SMSC connects to the peer over SCTP, keeps the connection up, and sends it the requests of its routes. The
        cores and HSSs that connect to the SMSC need no peer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeerParams"
      responses:
        "201":
          $ref: "#/components/responses/Peer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/diameter/peers/{id}:
    get:
      tags: [Diameter]
      operationId: getDiameterPeer
      summary: Get Diameter peer
      parameters:
        - $ref: "#/components/parameters/PeerID"
      responses:
        "200":
          $ref: "#/components/responses/Peer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Diameter]
      operationId: updateDiameterPeer
      summary: Update Diameter peer
      parameters:
        - $ref: "#/components/parameters/PeerID"
      description: >-
        A change of routes or priorities keeps the connection. A change of host, addresses or port replaces it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeerParams"
      responses:
        "200":
          $ref: "#/components/responses/Peer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Diameter]
      operationId: deleteDiameterPeer
      summary: Delete Diameter peer
      parameters:
        - $ref: "#/components/parameters/PeerID"
      description: Closes the connection to the peer.
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/operator:
    get:
      tags: [Operator]
      operationId: getOperator
      summary: Get operator settings
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          $ref: "#/components/responses/OperatorSettings"
    put:
      tags: [Operator]
      operationId: updateOperator
      summary: Update operator settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorSettings"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          $ref: "#/components/responses/OperatorSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/delivery:
    get:
      tags: [Delivery]
      operationId: getDelivery
      summary: Get delivery settings
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          $ref: "#/components/responses/DeliverySettings"
    put:
      tags: [Delivery]
      operationId: updateDelivery
      summary: Update delivery settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliverySettings"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          $ref: "#/components/responses/DeliverySettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/livez:
    get:
      tags: [Status]
      operationId: getLivez
      security: []
      summary: Check liveness
      description: >-
        Answers while the process serves HTTP.
      responses:
        "204":
          description: Live.

  /api/v1/readyz:
    get:
      tags: [Status]
      operationId: getReadyz
      security: []
      summary: Check readiness
      description: >-
        Whether the SMSC can serve requests: its database answers, and it is not shutting down.
      responses:
        "204":
          description: Ready.
        "503":
          description: Not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/status:
    get:
      tags: [Status]
      operationId: getStatus
      security: []
      summary: Get status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/Status"

  /api/v1/metrics:
    get:
      tags: [Metrics]
      operationId: getMetrics
      security: []
      summary: Get the metrics of the SMSC in the Prometheus formats
      responses:
        "200":
          description: The metrics, in the format the request's Accept header negotiates
          content:
            text/plain:
              schema:
                type: string

  /api/v1/pprof/:
    get:
      tags: [Profiling]
      operationId: getPprofIndex
      summary: Get pprof index
      description: The HTML page that lists the profiles.
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/allocs:
    get:
      tags: [Profiling]
      operationId: getPprofAllocs
      summary: Get the allocation profile
      parameters:
        - $ref: "#/components/parameters/PprofDebug"
        - $ref: "#/components/parameters/PprofDelta"
      responses:
        "200":
          $ref: "#/components/responses/PprofProfile"
        "400":
          $ref: "#/components/responses/PprofError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/goroutine:
    get:
      tags: [Profiling]
      operationId: getPprofGoroutine
      summary: Get the goroutine profile
      parameters:
        - $ref: "#/components/parameters/PprofDebug"
        - $ref: "#/components/parameters/PprofDelta"
      responses:
        "200":
          $ref: "#/components/responses/PprofProfile"
        "400":
          $ref: "#/components/responses/PprofError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/heap:
    get:
      tags: [Profiling]
      operationId: getPprofHeap
      summary: Get the heap profile
      parameters:
        - $ref: "#/components/parameters/PprofDebug"
        - $ref: "#/components/parameters/PprofGC"
        - $ref: "#/components/parameters/PprofDelta"
      responses:
        "200":
          $ref: "#/components/responses/PprofProfile"
        "400":
          $ref: "#/components/responses/PprofError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/threadcreate:
    get:
      tags: [Profiling]
      operationId: getPprofThreadcreate
      summary: Get the thread creation profile
      parameters:
        - $ref: "#/components/parameters/PprofDebug"
      responses:
        "200":
          $ref: "#/components/responses/PprofProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/cmdline:
    get:
      tags: [Profiling]
      operationId: getPprofCmdline
      summary: Get the command line
      description: The arguments of the process, separated by NUL bytes.
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/profile:
    get:
      tags: [Profiling]
      operationId: getPprofCPUProfile
      summary: Get a CPU profile
      parameters:
        - name: seconds
          in: query
          description: Duration of the profile.
          schema:
            type: integer
            minimum: 1
            default: 30
      responses:
        "200":
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/PprofError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/PprofError"

  /api/v1/pprof/symbol:
    get:
      tags: [Profiling]
      operationId: getPprofSymbol
      summary: Get the number of symbols
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Profiling]
      operationId: postPprofSymbol
      summary: Resolve program counters to function names
      requestBody:
        description: Program counters in hexadecimal, separated by +.
        content:
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/trace:
    get:
      tags: [Profiling]
      operationId: getPprofTrace
      summary: Get an execution trace
      parameters:
        - name: seconds
          in: query
          description: Duration of the trace.
          schema:
            type: number
            exclusiveMinimum: 0
            default: 1
      responses:
        "200":
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/PprofError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/PprofError"

  /api/v1/openapi.yaml:
    get:
      tags: [Specification]
      operationId: getOpenAPISpec
      security: []
      summary: Get OpenAPI specification
      responses:
        "200":
          description: OK
          content:
            application/openapi+yaml:
              schema:
                type: string

  /api/v1/init:
    post:
      tags: [Auth]
      operationId: initialize
      security: []
      summary: Create the first user
      description: >-
        Creates the first user, an admin, and logs it in. Until it is called, anyone who can reach the API can call it.
        It fails once a user exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitializeParams"
      responses:
        "201":
          $ref: "#/components/responses/Login"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      summary: Log in
      description: >-
        Returns an access token, valid for 15 minutes, and sets the session cookie with which
        POST /api/v1/auth/refresh issues new ones. At most 20 attempts per minute per client address (IPv6 /64), and
        100 wrong passwords per hour per account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginParams"
      responses:
        "200":
          $ref: "#/components/responses/Login"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      security:
        - SessionCookie: []
      summary: Refresh the access token
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/RefreshResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      security: []
      summary: Log out
      description: Ends the session of the cookie, if any, and clears the cookie.
      responses:
        "204":
          description: Logged out

  /api/v1/users/me:
    get:
      tags: [Users]
      operationId: getMyUser
      summary: Get my user
      responses:
        "200":
          $ref: "#/components/responses/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/users/me/password:
    put:
      tags: [Users]
      operationId: updateMyPassword
      summary: Change my password
      description: >-
        Ends the other sessions of the user. A wrong current password counts as a failed login of the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMyPasswordParams"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/me/api-tokens:
    get:
      tags: [Users]
      operationId: listMyAPITokens
      summary: List my API tokens
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          $ref: "#/components/responses/APITokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Users]
      operationId: createMyAPIToken
      summary: Create an API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPITokenParams"
      responses:
        "201":
          $ref: "#/components/responses/CreatedAPIToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/me/api-tokens/{id}:
    delete:
      tags: [Users]
      operationId: deleteMyAPIToken
      summary: Delete an API token
      parameters:
        - $ref: "#/components/parameters/APITokenID"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/ListUsersResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Users]
      operationId: createUser
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserParams"
      responses:
        "201":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/{email}:
    get:
      tags: [Users]
      operationId: getUser
      summary: Get user
      parameters:
        - $ref: "#/components/parameters/Email"
      responses:
        "200":
          $ref: "#/components/responses/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Users]
      operationId: updateUser
      summary: Change the role of a user
      description: Ends the sessions of the user. An admin cannot change its own role.
      parameters:
        - $ref: "#/components/parameters/Email"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserParams"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete user
      description: Deletes the user with its sessions and API tokens. An admin cannot delete itself.
      parameters:
        - $ref: "#/components/parameters/Email"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/{email}/password:
    put:
      tags: [Users]
      operationId: updateUserPassword
      summary: Set the password of a user
      description: Ends the sessions of the user.
      parameters:
        - $ref: "#/components/parameters/Email"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePasswordParams"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/{email}/api-tokens:
    get:
      tags: [Users]
      operationId: listUserAPITokens
      summary: List the API tokens of a user
      parameters:
        - $ref: "#/components/parameters/Email"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          $ref: "#/components/responses/APITokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Users]
      operationId: createUserAPIToken
      summary: Create an API token for a user
      parameters:
        - $ref: "#/components/parameters/Email"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPITokenParams"
      responses:
        "201":
          $ref: "#/components/responses/CreatedAPIToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/{email}/api-tokens/{id}:
    delete:
      tags: [Users]
      operationId: deleteUserAPIToken
      summary: Delete an API token of a user
      parameters:
        - $ref: "#/components/parameters/Email"
        - $ref: "#/components/parameters/APITokenID"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >-
        An access token from POST /api/v1/auth/login, or an API token, which starts with ellasmsc_. An access token
        ends with its session. An API token cannot create API tokens, change a password, or manage users: those
        operations answer 403 to it.
    SessionCookie:
      type: apiKey
      in: cookie
      name: smsc_session
      description: >-
        The session that a login or the initialization starts, for POST /api/v1/auth/refresh. Over TLS, the cookie is
        __Host-smsc_session.

  parameters:
    Email:
      name: email
      in: path
      required: true
      schema:
        type: string
        format: email
    APITokenID:
      name: id
      in: path
      required: true
      description: The ID of the token, the part of it between ellasmsc_ and the next underscore.
      schema:
        type: string
    PeerID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    MessageID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PprofDebug:
      name: debug
      in: query
      description: 0 for the protobuf format, 1 for text, 2 for the goroutine stacks in the format of a panic.
      schema:
        type: integer
        enum: [0, 1, 2]
        default: 0
    PprofDelta:
      name: seconds
      in: query
      description: Returns the difference of the profile over this duration.
      schema:
        type: integer
        minimum: 1
    PprofGC:
      name: gc
      in: query
      description: Greater than 0 runs a garbage collection first.
      schema:
        type: integer
        default: 0
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  responses:
    PeerParams:
      type: object
      additionalProperties: false
      required: [addresses, routes]
      properties:
        host:
          type: string
          description: >-
            The peer's Diameter identity, such as dea1.ipx.example.net. When set, the peer must give it as its
            Origin-Host, and connect from one of its addresses. Empty accepts the identity the peer gives.
          example: dea1.ipx.example.net
        addresses:
          type: array
          minItems: 1
          description: The peer's IP addresses, more than one for a multi-homed SCTP peer. List all of them.
          items:
            type: string
          example: ["192.0.2.10", "198.51.100.10"]
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 3868
        routes:
          type: array
          items:
            $ref: "#/components/schemas/PeerRoute"

    PeerRoute:
      type: object
      additionalProperties: false
      required: [application]
      properties:
        realm:
          type: string
          description: The Destination-Realm the route serves. Absent for a default route.
          example: epc.mnc002.mcc208.3gppnetwork.org
        default:
          type: boolean
          default: false
          description: >-
            Whether the route takes the foreign realms that no other route or connected peer serves, such as the
            visited networks of roaming subscribers. It never takes the SMSC's own realm. Only sgd takes one.
        application:
          type: string
          enum: [s6c, sgd]
          description: s6c to reach the HSS through the peer, in the SMSC's own realm. sgd to reach MMEs and SMSFs.
        priority:
          type: integer
          minimum: 0
          default: 0
          description: The peers of a route are tried lowest priority first. Peers of equal priority share the requests.

    Peer:
      type: object
      required: [id, host, addresses, port, routes]
      properties:
        id:
          type: integer
          format: int64
        host:
          type: string
        addresses:
          type: array
          items:
            type: string
        port:
          type: integer
        routes:
          type: array
          items:
            $ref: "#/components/schemas/PeerRoute"
        status:
          type: object
          description: >-
            The connection to the peer, in reads only: the SMSC applies a change of peer after the response. Absent
            until the SMSC applies a new peer.
          required: [state, since]
          properties:
            state:
              type: string
              enum: [down, connecting, open, suspect, reopen, closing]
            host:
              type: string
              description: The Origin-Host the peer gave.
            realm:
              type: string
              description: The Origin-Realm the peer gave.
            since:
              type: string
              format: date-time
            error:
              type: string
              description: Why the last connection to the peer failed or closed.

    OperatorSettings:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/OperatorSettings"
    DeliverySettings:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/DeliverySettings"
    RetentionSettings:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/RetentionSettings"
    Peer:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/Peer"
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PprofProfile:
      description: OK
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
        text/plain:
          schema:
            type: string
    PprofError:
      description: The error of a profiling path, in plain text.
      content:
        text/plain:
          schema:
            type: string
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Too Many Requests
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Login:
      description: Logged in. The response sets the smsc_session cookie.
      headers:
        Set-Cookie:
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/LoginResponse"
    Success:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/SuccessResponse"
    User:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/User"
    APITokens:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/ListAPITokensResponse"
    CreatedAPIToken:
      description: Created. The response is the only time the token is shown.
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/CreateAPITokenResponse"
    InternalError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    LoginParams:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    InitializeParams:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          $ref: "#/components/schemas/Password"

    LoginResponse:
      type: object
      required: [message, token]
      properties:
        message:
          type: string
        token:
          type: string
          description: The access token, valid for 15 minutes.

    RefreshResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string

    SuccessResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    Password:
      type: string
      description: 8 to 72 bytes.
      minLength: 8
      maxLength: 72

    RoleID:
      type: integer
      enum: [1, 2, 3, 4]
      description: >-
        1 Admin: everything. 2 Read Only: reads messages, Diameter and settings. 3 Network Manager: also submits
        messages and changes settings and Diameter peers. 4 Submitter: submits messages and reads only those it submitted.

    User:
      type: object
      required: [email, role_id]
      properties:
        email:
          type: string
          format: email
        role_id:
          $ref: "#/components/schemas/RoleID"

    ListUsersResponse:
      type: object
      required: [items, page, per_page, total_count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer

    CreateUserParams:
      type: object
      required: [email, password, role_id]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          $ref: "#/components/schemas/Password"
        role_id:
          $ref: "#/components/schemas/RoleID"

    UpdateUserParams:
      type: object
      required: [role_id]
      additionalProperties: false
      properties:
        role_id:
          $ref: "#/components/schemas/RoleID"

    UpdatePasswordParams:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password:
          $ref: "#/components/schemas/Password"

    UpdateMyPasswordParams:
      type: object
      required: [current_password, password]
      additionalProperties: false
      properties:
        current_password:
          type: string
        password:
          $ref: "#/components/schemas/Password"

    APIToken:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Absent for a token that does not expire.
        last_used_at:
          type: string
          format: date-time
          description: Absent for a token never used. Updated at most once a minute.

    ListAPITokensResponse:
      type: object
      required: [items, page, per_page, total_count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/APIToken"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer

    CreateAPITokenParams:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 50
        expires_at:
          type: string
          format: date-time
          description: When the token expires. Without it, the token does not expire.

    CreateAPITokenResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The token, ellasmsc_ followed by its ID, an underscore and its secret.

    E164:
      type: string
      pattern: '^\+[1-9][0-9]{0,14}$'
      examples: ["+15551230001"]

    Originator:
      description: >-
        An E.164 number, or a name of 1 to 11 ASCII letters and digits, with single spaces between words, that is not
        all digits (TS 23.040
        clause 9.1.2.5, Type-of-number alphanumeric). A value that starts with + is an E.164 number. A name is
        delivered as given.
      oneOf:
        - $ref: "#/components/schemas/E164"
        - type: string
          pattern: '^(?=.{1,11}$)(?=.*[^0-9])[A-Za-z0-9]+( [A-Za-z0-9]+)*$'
      examples: ["+15551230001", "EllaSMSC"]

    MessageStatus:
      type: string
      description: >-
        replaced: a later message from the same phone, with the same replace type (TS 23.040 clause 9.2.3.9),
        replaced it before its delivery.
      enum: [pending, delivered, failed, expired, replaced]

    StatusReports:
      type: object
      description: >-
        Whether the phone that sent the message asked for status reports (TP-SRR), and the SMS-STATUS-REPORTs the
        SMSC returned to it (TS 23.040 clause 3.2.9). A message submitted through the API never asks for reports.
      required: [requested, reports]
      properties:
        requested:
          type: boolean
        reports:
          type: array
          description: Oldest first.
          items:
            $ref: "#/components/schemas/StatusReport"

    StatusReport:
      type: object
      required: [id, tp_status, tp_status_name, status, created_at, updated_at, expires_at]
      properties:
        id:
          type: integer
          format: int64
        tp_status:
          type: integer
          minimum: 0
          maximum: 255
          description: The TP-Status that the report tells (TS 23.040 clause 9.2.3.15).
        tp_status_name:
          type: string
          description: >-
            The meaning of tp_status in TS 23.040 clause 9.2.3.15; reserved and sc_specific for values the
            specification does not name.
          examples: [received, replaced, no_response, validity_period_expired]
        status:
          type: string
          description: The delivery of the report to the phone.
          enum: [pending, delivered, failed, expired]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        next_attempt_at:
          type: string
          format: date-time

    CreateMessageParams:
      type: object
      description: Exactly one of text and binary.
      required: [from, to]
      properties:
        from:
          $ref: "#/components/schemas/Originator"
        to:
          $ref: "#/components/schemas/E164"
        text:
          type: string
          minLength: 1
        binary:
          $ref: "#/components/schemas/BinaryParams"

    BinaryParams:
      type: object
      description: >-
        One short message whose TPDU parameters the caller codes, such as a (U)SIM data download message (3GPP TS 23.040
        clause 9.2.3.9). The SMSC delivers them unchanged. The user data header and user data together are at most 140
        octets.
      required: [data_coding_scheme, user_data]
      properties:
        protocol_identifier:
          type: integer
          minimum: 0
          maximum: 255
          default: 0
          description: >-
            TP-PID (3GPP TS 23.040 clause 9.2.3.9). Telematic interworking is not supported. (U)SIM data download (127)
            and ANSI-136 R-DATA (124) need a data coding scheme of message class 2. Device triggering (72) needs an
            application port addressing information element in the user data header.
        data_coding_scheme:
          type: integer
          minimum: 0
          maximum: 255
          description: TP-DCS (3GPP TS 23.038 clause 4). It must not code the GSM 7 bit default alphabet or UCS2; send text instead.
        user_data_header:
          allOf:
            - $ref: "#/components/schemas/Octets"
          description: The TP-UDH, its length octet included (3GPP TS 23.040 clause 9.2.3.24). Absent when the user data has no header.
        user_data:
          allOf:
            - $ref: "#/components/schemas/Octets"
          description: The TP-UD that follows the header.

    Octets:
      type: string
      pattern: "^([0-9a-fA-F]{2})*$"
      description: Octets in hexadecimal, two digits each. Responses use lowercase.
      example: "027000"

    CreateMessageResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"

    ListMessagesResponse:
      type: object
      required: [items, page, per_page, total_count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer

    ListAttemptsResponse:
      type: object
      required: [items, page, per_page, total_count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Attempt"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer

    Concatenation:
      type: object
      required: [reference, part, total]
      properties:
        reference:
          type: integer
          minimum: 0
          maximum: 65535
        part:
          type: integer
          minimum: 0
          maximum: 255
        total:
          type: integer
          minimum: 0
          maximum: 255

    Message:
      type: object
      required: [id, from, to, encoding, status, created_at, updated_at, expires_at, status_report]
      properties:
        id:
          type: integer
          format: int64
        from:
          type: string
        to:
          $ref: "#/components/schemas/E164"
        encoding:
          type: string
          enum: [gsm7, ucs2, binary]
        concatenation:
          $ref: "#/components/schemas/Concatenation"
        status:
          $ref: "#/components/schemas/MessageStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        next_attempt_at:
          type: string
          format: date-time
        status_report:
          $ref: "#/components/schemas/StatusReports"
        submitted_by:
          type: string
          format: email
          description: >-
            The user that submitted a message over the API. A user with the Submitter role reads only the messages
            it submitted.

    MessageContent:
      type: object
      properties:
        text:
          type: string
          description: Absent for a binary message.
        binary:
          $ref: "#/components/schemas/BinaryContent"
        deliver_reports:
          type: array
          description: >-
            The SMS-DELIVER-REPORTs that the recipient answered with, when the serving node passed them on: in the
            RP-ACK of a delivery attempt that succeeded, and in the RP-ERROR of one that failed (3GPP TS 23.040 clause
            9.2.2.1a). Their user data is for the originator, such as a (U)SIM's answer to a (U)SIM data download
            message. Absent when there are none.
          items:
            $ref: "#/components/schemas/DeliverReport"

    BinaryContent:
      type: object
      description: The TPDU parameters of a binary message.
      required: [protocol_identifier, data_coding_scheme, user_data]
      properties:
        protocol_identifier:
          type: integer
          minimum: 0
          maximum: 255
        data_coding_scheme:
          type: integer
          minimum: 0
          maximum: 255
        user_data_header:
          allOf:
            - $ref: "#/components/schemas/Octets"
          description: The TP-UDH, its length octet included. Absent when the user data has no header.
        user_data:
          $ref: "#/components/schemas/Octets"

    DeliverReport:
      type: object
      required: [attempt_id, tpdu]
      properties:
        attempt_id:
          type: integer
          format: int64
          description: The delivery attempt that the recipient answered.
        tpdu:
          allOf:
            - $ref: "#/components/schemas/Octets"
          description: The SMS-DELIVER-REPORT. The other properties are absent when it does not decode.
        protocol_identifier:
          type: integer
          minimum: 0
          maximum: 255
        data_coding_scheme:
          type: integer
          minimum: 0
          maximum: 255
        user_data_header:
          $ref: "#/components/schemas/Octets"
        user_data:
          allOf:
            - $ref: "#/components/schemas/Octets"
          description: Absent when the report has no user data.

    Attempt:
      type: object
      required: [id, started_at, completed_at, step, outcome]
      properties:
        id:
          type: integer
          format: int64
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        step:
          type: string
          enum: [routing, delivery]
        node:
          type: string
        node_type:
          type: string
          enum: [mme, sgsn, ip_sm_gw, smsf_3gpp, smsf_non_3gpp]
        outcome:
          type: string
          enum:
            - success
            - timeout
            - no_hss
            - unreachable
            - diameter_error
            - error
            - user_unknown
            - absent_user
            - user_busy_for_mt_sms
            - facility_not_supported
            - illegal_user
            - illegal_equipment
            - sm_delivery_failure
            - service_not_subscribed
            - service_barred
            - mwd_list_full
        result_code:
          type: integer
          format: uint32
        vendor_id:
          type: integer
          format: uint32
        failure_cause:
          type: string
        tp_failure_cause:
          type: string
        absent_user_diagnostics:
          $ref: "#/components/schemas/AbsentUserDiagnostics"

    AbsentUserDiagnostics:
      type: object
      properties:
        mme:
          type: string
        msc:
          type: string
        sgsn:
          type: string
        ip_sm_gw:
          type: string
        smsf_3gpp:
          type: string
        smsf_non_3gpp:
          type: string

    Status:
      type: object
      required: [version, revision, initialized]
      properties:
        initialized:
          type: boolean
          description: Whether the first user exists. Until it does, POST /api/v1/init creates it.
        version:
          type: string
          example: v0.0.1
        revision:
          type: string
          description: Git commit the binary was built from. Empty for development builds.

    DiameterStatus:
      type: object
      required: [host, realm, peers, routes]
      properties:
        host:
          type: string
        realm:
          type: string
        peers:
          type: array
          items:
            $ref: "#/components/schemas/DiameterPeer"
        routes:
          type: array
          items:
            $ref: "#/components/schemas/DiameterRoute"

    DiameterRoute:
      type: object
      required: [realm, default, application, peers]
      properties:
        realm:
          type: string
          description: Empty for a default route.
        default:
          type: boolean
          description: >-
            Whether the route takes the foreign realms that no other route or connected peer serves. It never takes the
            SMSC's own realm.
        application:
          type: string
        peers:
          type: array
          description: Hosts of the open peers that can serve this route.
          items:
            type: string

    OperatorSettings:
      type: object
      additionalProperties: false
      required: [mcc, mnc, service_centre_address, numbering]
      properties:
        mcc:
          type: string
          pattern: "^[0-9]{3}$"
          example: "001"
        mnc:
          type: string
          pattern: "^[0-9]{2,3}$"
          description: Together with mcc, sets the Diameter realm epc.mnc<MNC>.mcc<MCC>.3gppnetwork.org and host smsc.node.<realm>.
          example: "01"
        service_centre_address:
          $ref: "#/components/schemas/E164"
        numbering:
          type: object
          additionalProperties: false
          required: [country_code, national_prefix, international_prefix]
          properties:
            country_code:
              type: string
              pattern: "^[1-9][0-9]{0,2}$"
              example: "1"
            national_prefix:
              type: string
              pattern: "^[0-9]{0,4}$"
              example: "1"
            international_prefix:
              type: string
              pattern: "^[0-9]{0,4}$"
              description: Must differ from national_prefix when both are set.
              example: "011"

    RetentionSettings:
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days:
          type: integer
          format: int64
          minimum: 1
          description: How long a message is kept once it has its final status, with its status reports and delivery attempts.
          example: 30

    DeliverySettings:
      type: object
      additionalProperties: false
      required: [default_validity_seconds, retry_intervals_seconds]
      properties:
        default_validity_seconds:
          type: integer
          format: int64
          minimum: 1
          description: How long delivery of a message without its own validity period is attempted.
          example: 604800
        retry_intervals_seconds:
          type: array
          description: Wait before each retry. The last interval repeats. Empty means a failed delivery is not retried.
          items:
            type: integer
            format: int64
            minimum: 1
          example: [60, 300, 900, 3600]

    DiameterPeer:
      type: object
      required: [configured, host, realm, address, state, applications, since]
      properties:
        id:
          type: integer
          format: int64
          description: The ID of a configured peer. Absent for a peer that connected to the SMSC.
        configured:
          type: boolean
        host:
          type: string
        realm:
          type: string
        address:
          type: string
        state:
          type: string
          enum: [down, connecting, open, suspect, reopen, closing]
        applications:
          type: array
          items:
            type: string
        since:
          type: string
          format: date-time
        error:
          type: string
          description: Why the last connection to the peer failed or closed.
