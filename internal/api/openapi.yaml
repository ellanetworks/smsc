openapi: "3.1.0"
info:
  title: Ella SMSC API
  version: "1.0.0"

servers:
  - url: "{scheme}://{host}"
    variables:
      scheme:
        default: http
        enum: [http, https]
      host:
        default: localhost:5010

security:
  - BearerAuth: []

tags:
  - name: Auth
  - name: Users
  - name: Messages
  - name: Operator
  - name: Diameter
  - name: Delivery
  - name: Status
  - name: Metrics
  - name: Specification

paths:
  /api/v1/messages:
    post:
      tags: [Messages]
      operationId: createMessage
      summary: Create message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageParams"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/CreateMessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Messages]
      operationId: listMessages
      summary: List messages
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: to
          in: query
          schema:
            $ref: "#/components/schemas/E164"
        - name: from
          in: query
          schema:
            $ref: "#/components/schemas/E164"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/MessageStatus"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/ListMessagesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/messages/{id}:
    get:
      tags: [Messages]
      operationId: getMessage
      summary: Get message
      parameters:
        - $ref: "#/components/parameters/MessageID"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/messages/{id}/attempts:
    get:
      tags: [Messages]
      operationId: listMessageAttempts
      summary: List delivery attempts
      parameters:
        - $ref: "#/components/parameters/MessageID"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/ListAttemptsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/diameter:
    get:
      tags: [Diameter]
      operationId: getDiameterStatus
      summary: Get Diameter status
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/DiameterStatus"

  /api/v1/operator:
    get:
      tags: [Operator]
      operationId: getOperator
      summary: Get operator settings
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          $ref: "#/components/responses/OperatorSettings"
    put:
      tags: [Operator]
      operationId: updateOperator
      summary: Update operator settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorSettings"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          $ref: "#/components/responses/OperatorSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/delivery:
    get:
      tags: [Delivery]
      operationId: getDelivery
      summary: Get delivery settings
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          $ref: "#/components/responses/DeliverySettings"
    put:
      tags: [Delivery]
      operationId: updateDelivery
      summary: Update delivery settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliverySettings"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          $ref: "#/components/responses/DeliverySettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/status:
    get:
      tags: [Status]
      operationId: getStatus
      security: []
      summary: Get status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/Status"

  /api/v1/metrics:
    get:
      tags: [Metrics]
      operationId: getMetrics
      security: []
      summary: Get the metrics of the SMSC in the Prometheus formats
      responses:
        "200":
          description: The metrics, in the format the request's Accept header negotiates
          content:
            text/plain:
              schema:
                type: string

  /api/v1/openapi.yaml:
    get:
      tags: [Specification]
      operationId: getOpenAPISpec
      security: []
      summary: Get OpenAPI specification
      responses:
        "200":
          description: OK
          content:
            application/openapi+yaml:
              schema:
                type: string

  /api/v1/init:
    post:
      tags: [Auth]
      operationId: initialize
      security: []
      summary: Create the first user
      description: >-
        Creates the first user, an admin, and logs it in. Until it is called, anyone who can reach the API can call it.
        It fails once a user exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitializeParams"
      responses:
        "201":
          $ref: "#/components/responses/Login"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      summary: Log in
      description: >-
        Returns an access token, valid for 15 minutes, and sets the session cookie with which
        POST /api/v1/auth/refresh issues new ones. At most 20 attempts per minute per client address (IPv6 /64), and
        100 wrong passwords per hour per account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginParams"
      responses:
        "200":
          $ref: "#/components/responses/Login"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      security:
        - SessionCookie: []
      summary: Refresh the access token
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/RefreshResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      security: []
      summary: Log out
      description: Ends the session of the cookie, if any, and clears the cookie.
      responses:
        "204":
          description: Logged out

  /api/v1/users/me:
    get:
      tags: [Users]
      operationId: getMyUser
      summary: Get my user
      responses:
        "200":
          $ref: "#/components/responses/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/users/me/password:
    put:
      tags: [Users]
      operationId: updateMyPassword
      summary: Change my password
      description: >-
        Ends the other sessions of the user. A wrong current password counts as a failed login of the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMyPasswordParams"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/me/api-tokens:
    get:
      tags: [Users]
      operationId: listMyAPITokens
      summary: List my API tokens
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          $ref: "#/components/responses/APITokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Users]
      operationId: createMyAPIToken
      summary: Create an API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPITokenParams"
      responses:
        "201":
          $ref: "#/components/responses/CreatedAPIToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/me/api-tokens/{id}:
    delete:
      tags: [Users]
      operationId: deleteMyAPIToken
      summary: Delete an API token
      parameters:
        - $ref: "#/components/parameters/APITokenID"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/ListUsersResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Users]
      operationId: createUser
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserParams"
      responses:
        "201":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/{email}:
    get:
      tags: [Users]
      operationId: getUser
      summary: Get user
      parameters:
        - $ref: "#/components/parameters/Email"
      responses:
        "200":
          $ref: "#/components/responses/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Users]
      operationId: updateUser
      summary: Change the role of a user
      description: Ends the sessions of the user. An admin cannot change its own role.
      parameters:
        - $ref: "#/components/parameters/Email"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserParams"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete user
      description: Deletes the user with its sessions and API tokens. An admin cannot delete itself.
      parameters:
        - $ref: "#/components/parameters/Email"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/{email}/password:
    put:
      tags: [Users]
      operationId: updateUserPassword
      summary: Set the password of a user
      description: Ends the sessions of the user.
      parameters:
        - $ref: "#/components/parameters/Email"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePasswordParams"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/{email}/api-tokens:
    get:
      tags: [Users]
      operationId: listUserAPITokens
      summary: List the API tokens of a user
      parameters:
        - $ref: "#/components/parameters/Email"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          $ref: "#/components/responses/APITokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Users]
      operationId: createUserAPIToken
      summary: Create an API token for a user
      parameters:
        - $ref: "#/components/parameters/Email"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPITokenParams"
      responses:
        "201":
          $ref: "#/components/responses/CreatedAPIToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/{email}/api-tokens/{id}:
    delete:
      tags: [Users]
      operationId: deleteUserAPIToken
      summary: Delete an API token of a user
      parameters:
        - $ref: "#/components/parameters/Email"
        - $ref: "#/components/parameters/APITokenID"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >-
        An access token from POST /api/v1/auth/login, or an API token, which starts with ellasmsc_. An access token
        ends with its session. An API token cannot create API tokens, change a password, or manage users: those
        operations answer 403 to it.
    SessionCookie:
      type: apiKey
      in: cookie
      name: smsc_session
      description: >-
        The session that a login or the initialization starts, for POST /api/v1/auth/refresh. Over TLS, the cookie is
        __Host-smsc_session.

  parameters:
    Email:
      name: email
      in: path
      required: true
      schema:
        type: string
        format: email
    APITokenID:
      name: id
      in: path
      required: true
      description: The ID of the token, the part of it between ellasmsc_ and the next underscore.
      schema:
        type: string
    MessageID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  responses:
    OperatorSettings:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/OperatorSettings"
    DeliverySettings:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/DeliverySettings"
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Too Many Requests
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Login:
      description: Logged in. The response sets the smsc_session cookie.
      headers:
        Set-Cookie:
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/LoginResponse"
    Success:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/SuccessResponse"
    User:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/User"
    APITokens:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/ListAPITokensResponse"
    CreatedAPIToken:
      description: Created. The response is the only time the token is shown.
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/CreateAPITokenResponse"
    InternalError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    LoginParams:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    InitializeParams:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          $ref: "#/components/schemas/Password"

    LoginResponse:
      type: object
      required: [message, token]
      properties:
        message:
          type: string
        token:
          type: string
          description: The access token, valid for 15 minutes.

    RefreshResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string

    SuccessResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    Password:
      type: string
      description: 8 to 72 bytes.
      minLength: 8
      maxLength: 72

    RoleID:
      type: integer
      enum: [1, 2, 3, 4]
      description: >-
        1 Admin: everything. 2 Read Only: reads messages, Diameter and settings. 3 Network Manager: also submits
        messages and changes settings. 4 Submitter: submits messages and reads only those it submitted.

    User:
      type: object
      required: [email, role_id]
      properties:
        email:
          type: string
          format: email
        role_id:
          $ref: "#/components/schemas/RoleID"

    ListUsersResponse:
      type: object
      required: [items, page, per_page, total_count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer

    CreateUserParams:
      type: object
      required: [email, password, role_id]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          $ref: "#/components/schemas/Password"
        role_id:
          $ref: "#/components/schemas/RoleID"

    UpdateUserParams:
      type: object
      required: [role_id]
      additionalProperties: false
      properties:
        role_id:
          $ref: "#/components/schemas/RoleID"

    UpdatePasswordParams:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password:
          $ref: "#/components/schemas/Password"

    UpdateMyPasswordParams:
      type: object
      required: [current_password, password]
      additionalProperties: false
      properties:
        current_password:
          type: string
        password:
          $ref: "#/components/schemas/Password"

    APIToken:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Absent for a token that does not expire.
        last_used_at:
          type: string
          format: date-time
          description: Absent for a token never used. Updated at most once a minute.

    ListAPITokensResponse:
      type: object
      required: [items, page, per_page, total_count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/APIToken"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer

    CreateAPITokenParams:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 50
        expires_at:
          type: string
          format: date-time
          description: When the token expires. Without it, the token does not expire.

    CreateAPITokenResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The token, ellasmsc_ followed by its ID, an underscore and its secret.

    E164:
      type: string
      pattern: '^\+[1-9][0-9]{0,14}$'
      examples: ["+15551230001"]

    MessageStatus:
      type: string
      description: >-
        replaced: a later message from the same phone, with the same replace type (TS 23.040 clause 9.2.3.9),
        replaced it before its delivery.
      enum: [pending, delivered, failed, expired, replaced]

    StatusReports:
      type: object
      description: >-
        Whether the phone that sent the message asked for status reports (TP-SRR), and the SMS-STATUS-REPORTs the
        SMSC returned to it (TS 23.040 clause 3.2.9). A message submitted through the API never asks for reports.
      required: [requested, reports]
      properties:
        requested:
          type: boolean
        reports:
          type: array
          description: Oldest first.
          items:
            $ref: "#/components/schemas/StatusReport"

    StatusReport:
      type: object
      required: [id, tp_status, tp_status_name, status, created_at, updated_at, expires_at]
      properties:
        id:
          type: integer
          format: int64
        tp_status:
          type: integer
          minimum: 0
          maximum: 255
          description: The TP-Status that the report tells (TS 23.040 clause 9.2.3.15).
        tp_status_name:
          type: string
          description: >-
            The meaning of tp_status in TS 23.040 clause 9.2.3.15; reserved and sc_specific for values the
            specification does not name.
          examples: [received, replaced, no_response, validity_period_expired]
        status:
          type: string
          description: The delivery of the report to the phone.
          enum: [pending, delivered, failed, expired]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        next_attempt_at:
          type: string
          format: date-time

    CreateMessageParams:
      type: object
      required: [from, to, text]
      properties:
        from:
          $ref: "#/components/schemas/E164"
        to:
          $ref: "#/components/schemas/E164"
        text:
          type: string
          minLength: 1

    CreateMessageResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"

    ListMessagesResponse:
      type: object
      required: [items, page, per_page, total_count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer

    ListAttemptsResponse:
      type: object
      required: [items, page, per_page, total_count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Attempt"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer

    Concatenation:
      type: object
      required: [reference, part, total]
      properties:
        reference:
          type: integer
          minimum: 0
          maximum: 65535
        part:
          type: integer
          minimum: 0
          maximum: 255
        total:
          type: integer
          minimum: 0
          maximum: 255

    Message:
      type: object
      required: [id, from, to, encoding, status, created_at, updated_at, expires_at, status_report]
      properties:
        id:
          type: integer
          format: int64
        from:
          type: string
        to:
          $ref: "#/components/schemas/E164"
        text:
          type: string
        encoding:
          type: string
          enum: [gsm7, ucs2, binary]
        concatenation:
          $ref: "#/components/schemas/Concatenation"
        status:
          $ref: "#/components/schemas/MessageStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        next_attempt_at:
          type: string
          format: date-time
        status_report:
          $ref: "#/components/schemas/StatusReports"
        submitted_by:
          type: string
          format: email
          description: >-
            The user that submitted a message over the API. A user with the Submitter role reads only the messages
            it submitted.

    Attempt:
      type: object
      required: [id, started_at, completed_at, step, outcome]
      properties:
        id:
          type: integer
          format: int64
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        step:
          type: string
          enum: [routing, delivery]
        node:
          type: string
        node_type:
          type: string
          enum: [mme, sgsn, ip_sm_gw, smsf_3gpp, smsf_non_3gpp]
        outcome:
          type: string
          enum:
            - success
            - timeout
            - no_hss
            - unreachable
            - diameter_error
            - error
            - user_unknown
            - absent_user
            - user_busy_for_mt_sms
            - facility_not_supported
            - illegal_user
            - illegal_equipment
            - sm_delivery_failure
            - service_not_subscribed
            - service_barred
            - mwd_list_full
        result_code:
          type: integer
          format: uint32
        vendor_id:
          type: integer
          format: uint32
        failure_cause:
          type: string
        tp_failure_cause:
          type: string
        absent_user_diagnostics:
          $ref: "#/components/schemas/AbsentUserDiagnostics"

    AbsentUserDiagnostics:
      type: object
      properties:
        mme:
          type: string
        msc:
          type: string
        sgsn:
          type: string
        ip_sm_gw:
          type: string
        smsf_3gpp:
          type: string
        smsf_non_3gpp:
          type: string

    Status:
      type: object
      required: [version, revision, initialized]
      properties:
        initialized:
          type: boolean
          description: Whether the first user exists. Until it does, POST /api/v1/init creates it.
        version:
          type: string
          example: v0.0.1
        revision:
          type: string
          description: Git commit the binary was built from. Empty for development builds.

    DiameterStatus:
      type: object
      required: [host, realm, peers, routes]
      properties:
        host:
          type: string
        realm:
          type: string
        peers:
          type: array
          items:
            $ref: "#/components/schemas/DiameterPeer"
        routes:
          type: array
          items:
            $ref: "#/components/schemas/DiameterRoute"

    DiameterRoute:
      type: object
      required: [realm, application, peers]
      properties:
        realm:
          type: string
        application:
          type: string
        peers:
          type: array
          description: Hosts of the open peers that can serve this route.
          items:
            type: string

    OperatorSettings:
      type: object
      additionalProperties: false
      required: [mcc, mnc, service_centre_address, numbering]
      properties:
        mcc:
          type: string
          pattern: "^[0-9]{3}$"
          example: "001"
        mnc:
          type: string
          pattern: "^[0-9]{2,3}$"
          description: Together with mcc, sets the Diameter realm epc.mnc<MNC>.mcc<MCC>.3gppnetwork.org and host smsc.node.<realm>.
          example: "01"
        service_centre_address:
          $ref: "#/components/schemas/E164"
        numbering:
          type: object
          additionalProperties: false
          required: [country_code, national_prefix, international_prefix]
          properties:
            country_code:
              type: string
              pattern: "^[1-9][0-9]{0,2}$"
              example: "1"
            national_prefix:
              type: string
              pattern: "^[0-9]{0,4}$"
              example: "1"
            international_prefix:
              type: string
              pattern: "^[0-9]{0,4}$"
              description: Must differ from national_prefix when both are set.
              example: "011"

    DeliverySettings:
      type: object
      additionalProperties: false
      required: [default_validity_seconds, retry_intervals_seconds]
      properties:
        default_validity_seconds:
          type: integer
          format: int64
          minimum: 1
          description: How long a message without its own validity period is kept for delivery.
          example: 604800
        retry_intervals_seconds:
          type: array
          description: Wait before each retry. The last interval repeats. Empty means a failed delivery is not retried.
          items:
            type: integer
            format: int64
            minimum: 1
          example: [60, 300, 900, 3600]

    DiameterPeer:
      type: object
      required: [host, realm, address, state, applications, since]
      properties:
        host:
          type: string
        realm:
          type: string
        address:
          type: string
        state:
          type: string
          enum: [down, connecting, open, suspect, reopen, closing]
        applications:
          type: array
          items:
            type: string
        since:
          type: string
          format: date-time
