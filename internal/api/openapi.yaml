openapi: "3.1.0"
info:
  title: Ella SMSC API
  version: "1.0.0"

servers:
  - url: "{scheme}://{host}"
    variables:
      scheme:
        default: http
        enum: [http, https]
      host:
        default: localhost:5010

security:
  - BearerAuth: []

tags:
  - name: Auth
  - name: Users
  - name: Single sign-on
  - name: Messages
  - name: Operator
  - name: Diameter
  - name: SMPP
  - name: Delivery
  - name: Status
  - name: Metrics
  - name: Profiling
  - name: Cluster
  - name: Backup
  - name: Specification

paths:
  /api/v1/messages:
    post:
      tags: [Messages]
      operationId: createMessage
      summary: Create message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageParams"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/CreateMessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Messages]
      operationId: listMessages
      summary: List messages
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: to
          in: query
          description: All or part of the recipient's E.164 number, with or without +. Matches the numbers that contain its digits.
          schema:
            type: string
            pattern: '^\+?[0-9]{1,15}$'
            examples: ["+1555123", "1230002"]
        - name: from
          in: query
          description: >-
            All or part of the sender's E.164 number, with or without +, which matches the numbers that contain its
            digits; or a name, as in the request to create a message, which matches that name in any case.
          schema:
            type: string
            examples: ["1230001", "EllaSMSC"]
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/MessageStatus"
        - name: start
          in: query
          description: Keeps the messages created at or after this time.
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          description: Keeps the messages created before this time. Must not be before start.
          schema:
            type: string
            format: date-time
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/ListMessagesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/messages/counts:
    get:
      tags: [Messages]
      operationId: countMessages
      summary: Count messages by status
      description: For a Submitter, only the messages it sent.
      parameters:
        - name: start
          in: query
          description: Counts the messages created at or after this time.
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          description: Counts the messages created before this time. Must not be before start.
          schema:
            type: string
            format: date-time
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/MessageCounts"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/messages/retention:
    get:
      tags: [Messages]
      operationId: getMessageRetention
      summary: Get message retention
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          $ref: "#/components/responses/RetentionSettings"
    put:
      tags: [Messages]
      operationId: updateMessageRetention
      summary: Update message retention
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionSettings"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          $ref: "#/components/responses/RetentionSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/messages/{id}:
    get:
      tags: [Messages]
      operationId: getMessage
      summary: Get message
      parameters:
        - $ref: "#/components/parameters/MessageID"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/messages/{id}/attempts:
    get:
      tags: [Messages]
      operationId: listMessageAttempts
      summary: List delivery attempts
      parameters:
        - $ref: "#/components/parameters/MessageID"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/ListAttemptsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/messages/{id}/content:
    get:
      tags: [Messages]
      operationId: getMessageContent
      summary: Get message content
      description: Each read logs an audit event.
      parameters:
        - $ref: "#/components/parameters/MessageID"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/MessageContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/diameter:
    get:
      tags: [Diameter]
      operationId: getDiameterStatus
      summary: Get Diameter status
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/DiameterStatus"

  /api/v1/diameter/peers:
    get:
      tags: [Diameter]
      operationId: listDiameterPeers
      summary: List Diameter peers
      description: The Diameter agents and nodes that the SMSC connects to, with their routes and connection status.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Peer"
    post:
      tags: [Diameter]
      operationId: createDiameterPeer
      summary: Create Diameter peer
      description: >-
        The SMSC connects to the peer over SCTP, keeps the connection up, and sends it the requests of its routes. The
        cores and HSSs that connect to the SMSC need no peer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeerParams"
      responses:
        "201":
          $ref: "#/components/responses/Peer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/diameter/peers/{id}:
    get:
      tags: [Diameter]
      operationId: getDiameterPeer
      summary: Get Diameter peer
      parameters:
        - $ref: "#/components/parameters/PeerID"
      responses:
        "200":
          $ref: "#/components/responses/Peer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Diameter]
      operationId: updateDiameterPeer
      summary: Update Diameter peer
      parameters:
        - $ref: "#/components/parameters/PeerID"
      description: >-
        A change of routes or priorities keeps the connection. A change of host, addresses or port replaces it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeerParams"
      responses:
        "200":
          $ref: "#/components/responses/Peer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Diameter]
      operationId: deleteDiameterPeer
      summary: Delete Diameter peer
      parameters:
        - $ref: "#/components/parameters/PeerID"
      description: Closes the connection to the peer.
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/esmes:
    get:
      tags: [SMPP]
      operationId: listESMEs
      summary: List ESMEs
      description: The accounts that External Short Message Entities bind to the SMPP listener with, and their sessions.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ESME"
    post:
      tags: [SMPP]
      operationId: createESME
      summary: Create ESME
      description: >-
        The ESME acts as its user: the messages it submits are the user's, and the user's role decides which binds
        it may make. Without a password, the SMSC generates one of 8 characters, which only this response returns.
        Needs a login, not an API token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateESMEParams"
      responses:
        "201":
          $ref: "#/components/responses/ESME"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/esmes/{system_id}:
    get:
      tags: [SMPP]
      operationId: getESME
      summary: Get ESME
      parameters:
        - $ref: "#/components/parameters/SystemID"
      responses:
        "200":
          $ref: "#/components/responses/ESME"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [SMPP]
      operationId: updateESME
      summary: Update ESME
      description: >-
        Closes the ESME's sessions, which bind again under the new settings. Without a password, the password stays.
        Needs a login, not an API token.
      parameters:
        - $ref: "#/components/parameters/SystemID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateESMEParams"
      responses:
        "200":
          $ref: "#/components/responses/ESME"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [SMPP]
      operationId: deleteESME
      summary: Delete ESME
      description: >-
        Closes the ESME's sessions, and drops the receipts and SIM answers not yet sent to it. Its messages stay, as
        its user's. Needs a login, not an API token.
      parameters:
        - $ref: "#/components/parameters/SystemID"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/operator:
    get:
      tags: [Operator]
      operationId: getOperator
      summary: Get operator settings
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          $ref: "#/components/responses/OperatorSettings"
    put:
      tags: [Operator]
      operationId: updateOperator
      summary: Update operator settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorSettings"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          $ref: "#/components/responses/OperatorSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/delivery:
    get:
      tags: [Delivery]
      operationId: getDelivery
      summary: Get delivery settings
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          $ref: "#/components/responses/DeliverySettings"
    put:
      tags: [Delivery]
      operationId: updateDelivery
      summary: Update delivery settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliverySettings"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          $ref: "#/components/responses/DeliverySettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/livez:
    get:
      tags: [Status]
      operationId: getLivez
      security: []
      summary: Check liveness
      description: >-
        Answers while the process serves HTTP.
      responses:
        "204":
          description: Live.

  /api/v1/readyz:
    get:
      tags: [Status]
      operationId: getReadyz
      security: []
      summary: Check readiness
      description: >-
        Whether this node should receive traffic: it is not shutting down or removed, it is initialized or joined
        when it has a cluster section, not draining, its database is
        consistent with the leader's and answers, it has a leader, and it is caught up with the leader's log. The
        checks read state the node already holds, without asking other nodes. A load balancer or a Kubernetes
        readiness probe calls it without parameters.
      parameters:
        - name: cluster
          in: query
          required: false
          description: >-
            Add the cluster check: every voter is healthy in the leader's view. For scripts and rolling upgrades, not
            for probes, since one failed voter makes every node fail it.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Ready. Every check passes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          description: Not ready. At least one check fails.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /api/v1/status:
    get:
      tags: [Status]
      operationId: getStatus
      security: []
      summary: Get status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/Status"

  /api/v1/metrics:
    get:
      tags: [Metrics]
      operationId: getMetrics
      security: []
      summary: Get the metrics of the SMSC in the Prometheus formats
      responses:
        "200":
          description: The metrics, in the format the request's Accept header negotiates
          content:
            text/plain:
              schema:
                type: string

  /api/v1/pprof/:
    get:
      tags: [Profiling]
      operationId: getPprofIndex
      summary: Get pprof index
      description: The HTML page that lists the profiles.
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/allocs:
    get:
      tags: [Profiling]
      operationId: getPprofAllocs
      summary: Get the allocation profile
      parameters:
        - $ref: "#/components/parameters/PprofDebug"
        - $ref: "#/components/parameters/PprofDelta"
      responses:
        "200":
          $ref: "#/components/responses/PprofProfile"
        "400":
          $ref: "#/components/responses/PprofError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/goroutine:
    get:
      tags: [Profiling]
      operationId: getPprofGoroutine
      summary: Get the goroutine profile
      parameters:
        - $ref: "#/components/parameters/PprofDebug"
        - $ref: "#/components/parameters/PprofDelta"
      responses:
        "200":
          $ref: "#/components/responses/PprofProfile"
        "400":
          $ref: "#/components/responses/PprofError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/goroutineleak:
    get:
      tags: [Profiling]
      operationId: getPprofGoroutineLeak
      summary: Get the goroutine leak profile
      parameters:
        - $ref: "#/components/parameters/PprofDebug"
        - $ref: "#/components/parameters/PprofDelta"
      responses:
        "200":
          $ref: "#/components/responses/PprofProfile"
        "400":
          $ref: "#/components/responses/PprofError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/heap:
    get:
      tags: [Profiling]
      operationId: getPprofHeap
      summary: Get the heap profile
      parameters:
        - $ref: "#/components/parameters/PprofDebug"
        - $ref: "#/components/parameters/PprofGC"
        - $ref: "#/components/parameters/PprofDelta"
      responses:
        "200":
          $ref: "#/components/responses/PprofProfile"
        "400":
          $ref: "#/components/responses/PprofError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/threadcreate:
    get:
      tags: [Profiling]
      operationId: getPprofThreadcreate
      summary: Get the thread creation profile
      parameters:
        - $ref: "#/components/parameters/PprofDebug"
      responses:
        "200":
          $ref: "#/components/responses/PprofProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/cmdline:
    get:
      tags: [Profiling]
      operationId: getPprofCmdline
      summary: Get the command line
      description: The arguments of the process, separated by NUL bytes.
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/profile:
    get:
      tags: [Profiling]
      operationId: getPprofCPUProfile
      summary: Get a CPU profile
      parameters:
        - name: seconds
          in: query
          description: Duration of the profile.
          schema:
            type: integer
            minimum: 1
            default: 30
      responses:
        "200":
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/PprofError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/PprofError"

  /api/v1/pprof/symbol:
    get:
      tags: [Profiling]
      operationId: getPprofSymbol
      summary: Get the number of symbols
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Profiling]
      operationId: postPprofSymbol
      summary: Resolve program counters to function names
      requestBody:
        description: Program counters in hexadecimal, separated by +.
        content:
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/trace:
    get:
      tags: [Profiling]
      operationId: getPprofTrace
      summary: Get an execution trace
      parameters:
        - name: seconds
          in: query
          description: Duration of the trace.
          schema:
            type: number
            exclusiveMinimum: 0
            default: 1
      responses:
        "200":
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/PprofError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/PprofError"

  /api/v1/openapi.yaml:
    get:
      tags: [Specification]
      operationId: getOpenAPISpec
      security: []
      summary: Get OpenAPI specification
      responses:
        "200":
          description: OK
          content:
            application/openapi+yaml:
              schema:
                type: string

  /api/v1/init:
    post:
      tags: [Auth]
      operationId: initialize
      security: []
      summary: Create the first user
      description: >-
        Creates the first user, an admin, and logs it in. Until it is called, anyone who can reach the API can call it.
        It fails once a user exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitializeParams"
      responses:
        "201":
          $ref: "#/components/responses/Login"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "410":
          $ref: "#/components/responses/Removed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Forming"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      summary: Log in
      description: >-
        Returns an access token, valid for 15 minutes, and sets the session cookie with which
        POST /api/v1/auth/refresh issues new ones. At most 20 attempts per minute per client address (IPv6 /64), and
        100 wrong passwords per hour per account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginParams"
      responses:
        "200":
          $ref: "#/components/responses/Login"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      security:
        - SessionCookie: []
      summary: Refresh the access token
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/RefreshResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      security: []
      summary: Log out
      description: Ends the session of the cookie, if any, and clears the cookie.
      responses:
        "204":
          description: Logged out

  /api/v1/auth/oidc:
    get:
      tags: [Auth]
      operationId: getOIDCLogin
      summary: Get the single sign-on option of the login page
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    type: object
                    required: [enabled]
                    properties:
                      enabled:
                        type: boolean
                      display_name:
                        type: string
                        description: The name on the login button. Absent when OIDC is off.

  /api/v1/auth/oidc/login:
    get:
      tags: [Auth]
      operationId: startOIDCLogin
      summary: Sign in through the identity provider
      description: >-
        For a browser. Redirects to the identity provider with the authorization code flow, PKCE, a state and a
        nonce, which a short-lived encrypted cookie keeps. When OIDC is off or the provider cannot be reached, it
        redirects to /login with an error.
      security: []
      responses:
        "303":
          $ref: "#/components/responses/OIDCRedirect"

  /api/v1/auth/oidc/callback:
    get:
      tags: [Auth]
      operationId: oidcCallback
      summary: Return from the identity provider
      description: >-
        The redirect URL registered with the identity provider. Each login completes once. On success, it sets the
        session cookie and redirects to /. Otherwise it redirects to /login?error= with one of rate_limited,
        unavailable, failed, denied, not_set_up, email_not_verified, linked_elsewhere, no_group, groups_overage,
        too_many_users, or error.
      security: []
      parameters:
        - {name: code, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
        - {name: iss, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
        - {name: error_description, in: query, schema: {type: string}}
      responses:
        "303":
          $ref: "#/components/responses/OIDCRedirect"

  /api/v1/users/me:
    get:
      tags: [Users]
      operationId: getMyUser
      summary: Get my user
      responses:
        "200":
          $ref: "#/components/responses/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/users/me/password:
    put:
      tags: [Users]
      operationId: updateMyPassword
      summary: Change my password
      description: >-
        Ends the other sessions of the user. A wrong current password counts as a failed login of the account. A user
        without a password gets a conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMyPasswordParams"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/me/api-tokens:
    get:
      tags: [Users]
      operationId: listMyAPITokens
      summary: List my API tokens
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          $ref: "#/components/responses/APITokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Users]
      operationId: createMyAPIToken
      summary: Create an API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPITokenParams"
      responses:
        "201":
          $ref: "#/components/responses/CreatedAPIToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/me/api-tokens/{id}:
    delete:
      tags: [Users]
      operationId: deleteMyAPIToken
      summary: Delete an API token
      parameters:
        - $ref: "#/components/parameters/APITokenID"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/oidc:
    get:
      tags: [Single sign-on]
      operationId: getOIDC
      summary: Get the OIDC settings
      description: The client secret is never returned. Needs a login, not an API token.
      responses:
        "200":
          $ref: "#/components/responses/OIDCSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Single sign-on]
      operationId: updateOIDC
      summary: Update the OIDC settings
      description: >-
        Replaces all the settings. An empty or missing client_secret keeps the current one, unless the issuer or
        the client ID changes (400). Disabling OIDC or changing the issuer ends all OIDC sessions. Needs a login,
        not an API token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOIDCParams"
      responses:
        "200":
          $ref: "#/components/responses/OIDCSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/oidc/discovery:
    post:
      tags: [Single sign-on]
      operationId: discoverOIDC
      summary: Test an identity provider
      description: >-
        Fetches the provider's OpenID configuration and signing keys, and checks that the provider can be used:
        502 when it cannot, including when its token endpoint accepts neither client_secret_basic nor
        client_secret_post. Changes no setting. Needs a login, not an API token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoverOIDCParams"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/OIDCDiscovery"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/v1/cluster:
    get:
      tags: [Cluster]
      operationId: getCluster
      summary: Get the cluster status
      description: >-
        The node answering, its cluster, the leader, and every member with its suffrage and Diameter label. Health
        comes from the leader and is absent when no leader answers.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/ClusterStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/cluster/tokens:
    post:
      tags: [Cluster]
      operationId: createJoinToken
      summary: Create a join token
      description: >-
        A single-use token that lets one new node join this cluster, with the members' addresses and certificate
        fingerprints. Needs a login, not an API token, and a node with a cluster address.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJoinTokenParams"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/JoinToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/cluster/join:
    post:
      tags: [Cluster]
      operationId: joinCluster
      summary: Join a cluster
      description: >-
        Called on the new node, which must have a cluster address, no user and no message. Needs no login. The
        node replaces its database with the cluster's and takes a Diameter host of its own.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinClusterParams"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          description: No member of the cluster answered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/cluster/members/{node_id}:
    put:
      tags: [Cluster]
      operationId: updateClusterMember
      summary: Update a cluster member
      parameters:
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      description: Sets the member's display name. Needs a login, not an API token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberParams"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [Cluster]
      operationId: removeClusterMember
      summary: Remove a cluster member
      parameters:
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: force
          in: query
          description: Remove a member that is not drained, such as one that is down for good.
          schema:
            type: boolean
      description: >-
        Removes a drained member from the cluster. The removed node closes its Diameter and SMPP listeners, fails
        readiness, and refuses to start until its data directory is deleted. Refused when the remaining voters could
        not commit writes. Needs a login, not an API token.
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/cluster/members/{node_id}/drain:
    post:
      tags: [Cluster]
      operationId: drainClusterMember
      summary: Drain a cluster member
      description: >-
        The member fails readiness, refuses new SMPP binds, closes its SMPP sessions, and hands the leadership over
        if it leads. Diameter stays up. It is then drained, and can be removed or stopped. Needs a
        login, not an API token.
      parameters:
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/cluster/members/{node_id}/resume:
    post:
      tags: [Cluster]
      operationId: resumeClusterMember
      summary: Resume a drained cluster member
      description: The member accepts SMPP binds again and passes readiness. Needs a login, not an API token.
      parameters:
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/backup:
    get:
      tags: [Backup]
      operationId: backup
      summary: Back up the database
      description: >-
        Streams a gzipped tar archive of a consistent copy of the database, with a manifest of its schema version,
        position and ID sequences, and the SHA-256 checksums of both. The archive holds message content, user
        accounts and the single sign-on client secret.
      responses:
        "200":
          description: OK
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/restore:
    post:
      tags: [Backup]
      operationId: restore
      summary: Restore the database from a backup
      description: >-
        Replaces every message, user and setting with those of an archive from GET /api/v1/backup, after checking
        its checksums and that its schema is not newer than this version's. IDs keep increasing: a message ID
        already returned is never reused. SMPP sessions are closed. Needs a login, not an API token.
      requestBody:
        required: true
        content:
          application/gzip:
            schema:
              type: string
              format: binary
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/ListUsersResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Users]
      operationId: createUser
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserParams"
      responses:
        "201":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/{email}:
    get:
      tags: [Users]
      operationId: getUser
      summary: Get user
      parameters:
        - $ref: "#/components/parameters/Email"
      responses:
        "200":
          $ref: "#/components/responses/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Users]
      operationId: updateUser
      summary: Change the role of a user
      description: >-
        A role change ends the sessions of the user. An admin cannot change its own role. When OIDC group mapping
        is on, the role of a linked user comes from their groups, so changing it needs role_pinned set to true.
      parameters:
        - $ref: "#/components/parameters/Email"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserParams"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete user
      description: >-
        Deletes the user with its sessions and API tokens. An admin cannot delete itself, and the last admin with
        a password cannot be deleted.
      parameters:
        - $ref: "#/components/parameters/Email"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/{email}/password:
    put:
      tags: [Users]
      operationId: updateUserPassword
      summary: Set the password of a user
      description: Ends the sessions of the user.
      parameters:
        - $ref: "#/components/parameters/Email"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePasswordParams"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Users]
      operationId: deleteUserPassword
      summary: Remove the password of a user
      description: >-
        The user can then sign in only through OIDC. Ends the sessions of the user. The last admin with a password
        keeps it. 409 when the user has no password.
      parameters:
        - $ref: "#/components/parameters/Email"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/{email}/oidc:
    delete:
      tags: [Users]
      operationId: deleteUserOIDCLink
      summary: Unlink a user from their identity provider account
      description: >-
        Ends the OIDC sessions of the user. Their next OIDC login links them again by verified email. 404 when the
        user is not linked to the current issuer.
      parameters:
        - $ref: "#/components/parameters/Email"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/{email}/api-tokens:
    get:
      tags: [Users]
      operationId: listUserAPITokens
      summary: List the API tokens of a user
      parameters:
        - $ref: "#/components/parameters/Email"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          $ref: "#/components/responses/APITokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Users]
      operationId: createUserAPIToken
      summary: Create an API token for a user
      parameters:
        - $ref: "#/components/parameters/Email"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPITokenParams"
      responses:
        "201":
          $ref: "#/components/responses/CreatedAPIToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/{email}/api-tokens/{id}:
    delete:
      tags: [Users]
      operationId: deleteUserAPIToken
      summary: Delete an API token of a user
      parameters:
        - $ref: "#/components/parameters/Email"
        - $ref: "#/components/parameters/APITokenID"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >-
        An access token from POST /api/v1/auth/login, or an API token, which starts with ellasmsc_. An access token
        ends with its session. An API token cannot create API tokens, change a password, or manage users: those
        operations answer 403 to it.
    SessionCookie:
      type: apiKey
      in: cookie
      name: smsc_session
      description: >-
        The session that a login or the initialization starts, for POST /api/v1/auth/refresh. Over TLS, the cookie is
        __Host-smsc_session.

  parameters:
    Email:
      name: email
      in: path
      required: true
      schema:
        type: string
        format: email
    APITokenID:
      name: id
      in: path
      required: true
      description: The ID of the token, the part of it between ellasmsc_ and the next underscore.
      schema:
        type: string
    SystemID:
      name: system_id
      in: path
      required: true
      description: The system_id of the ESME, URL-encoded.
      schema:
        type: string
        minLength: 1
        maxLength: 15
    PeerID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    MessageID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PprofDebug:
      name: debug
      in: query
      description: 0 for the protobuf format, 1 for text, 2 for the goroutine stacks in the format of a panic.
      schema:
        type: integer
        enum: [0, 1, 2]
        default: 0
    PprofDelta:
      name: seconds
      in: query
      description: Returns the difference of the profile over this duration.
      schema:
        type: integer
        minimum: 1
    PprofGC:
      name: gc
      in: query
      description: Greater than 0 runs a garbage collection first.
      schema:
        type: integer
        default: 0
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  responses:
    PeerParams:
      type: object
      additionalProperties: false
      required: [addresses, routes]
      properties:
        host:
          type: string
          description: >-
            The peer's Diameter identity, such as dea1.ipx.example.net. When set, the peer must give it as its
            Origin-Host, and connect from one of its addresses. Empty accepts the identity the peer gives.
          example: dea1.ipx.example.net
        addresses:
          type: array
          minItems: 1
          description: The peer's IP addresses, more than one for a multi-homed SCTP peer. List all of them.
          items:
            type: string
          example: ["192.0.2.10", "198.51.100.10"]
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 3868
        routes:
          type: array
          items:
            $ref: "#/components/schemas/PeerRoute"

    PeerRoute:
      type: object
      additionalProperties: false
      required: [application]
      properties:
        realm:
          type: string
          description: The Destination-Realm the route serves. Absent for a default route.
          example: epc.mnc002.mcc208.3gppnetwork.org
        default:
          type: boolean
          default: false
          description: >-
            Whether the route takes the foreign realms that no other route or connected peer serves, such as the
            visited networks of roaming subscribers. It never takes the SMSC's own realm. Only sgd takes one.
        application:
          type: string
          enum: [s6c, sgd]
          description: s6c to reach the HSS through the peer, in the SMSC's own realm. sgd to reach MMEs and SMSFs.
        priority:
          type: integer
          minimum: 0
          default: 0
          description: The peers of a route are tried lowest priority first. Peers of equal priority share the requests.

    ESME:
      type: object
      required: [system_id, user, allowed_networks, created_at, sessions]
      properties:
        system_id:
          type: string
          minLength: 1
          maxLength: 15
        user:
          type: string
          format: email
          description: The user the ESME acts as.
        allowed_networks:
          type: array
          description: The networks that the ESME may bind from. None allows no address.
          items:
            type: string
            example: 10.1.0.0/24
        created_at:
          type: string
          format: date-time
        sessions:
          type: array
          items:
            type: object
            required: [bind_type, remote_address, bound_at]
            properties:
              bind_type:
                type: string
                enum: [transmitter, receiver, transceiver]
              remote_address:
                type: string
              bound_at:
                type: string
                format: date-time
        password:
          type: string
          description: The generated password, in the response that creates the ESME only.

    CreateESMEParams:
      type: object
      additionalProperties: false
      required: [system_id, user]
      properties:
        system_id:
          type: string
          minLength: 1
          maxLength: 15
          description: Printable ASCII.
        user:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 8
          description: Printable ASCII. Absent, the SMSC generates one.
        allowed_networks:
          type: array
          maxItems: 50
          items:
            type: string

    UpdateESMEParams:
      type: object
      additionalProperties: false
      required: [allowed_networks]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 8
          description: Printable ASCII. Absent, the password stays.
        allowed_networks:
          type: array
          maxItems: 50
          items:
            type: string

    Peer:
      type: object
      required: [id, host, addresses, port, routes]
      properties:
        id:
          type: integer
          format: int64
        host:
          type: string
        addresses:
          type: array
          items:
            type: string
        port:
          type: integer
        routes:
          type: array
          items:
            $ref: "#/components/schemas/PeerRoute"
        status:
          type: object
          description: >-
            The connection to the peer, in reads only: the SMSC applies a change of peer after the response. Absent
            until the SMSC applies a new peer.
          required: [state, since]
          properties:
            state:
              type: string
              enum: [down, connecting, open, suspect, reopen, closing]
            host:
              type: string
              description: The Origin-Host the peer gave.
            realm:
              type: string
              description: The Origin-Realm the peer gave.
            since:
              type: string
              format: date-time
            error:
              type: string
              description: Why the last connection to the peer failed or closed.

    OperatorSettings:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/OperatorSettings"
    DeliverySettings:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/DeliverySettings"
    RetentionSettings:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/RetentionSettings"
    ESME:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/ESME"
    Peer:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/Peer"
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PprofProfile:
      description: OK
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
        text/plain:
          schema:
            type: string
    PprofError:
      description: The error of a profiling path, in plain text.
      content:
        text/plain:
          schema:
            type: string
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Gone:
      description: The node was removed from the cluster.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OIDCRedirect:
      description: See Other
      headers:
        Location:
          schema:
            type: string
        Set-Cookie:
          schema:
            type: string
    ServiceUnavailable:
      description: Too busy, or not ready. Retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: The identity provider cannot be reached or cannot be used.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OIDCSettings:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/OIDCSettings"
    TooManyRequests:
      description: Too Many Requests
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Login:
      description: Logged in. The response sets the smsc_session cookie.
      headers:
        Set-Cookie:
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/LoginResponse"
    Success:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/SuccessResponse"
    User:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/User"
    APITokens:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/ListAPITokensResponse"
    CreatedAPIToken:
      description: Created. The response is the only time the token is shown.
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/CreateAPITokenResponse"
    InternalError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forming:
      description: >-
        The cluster is forming. Until the node is a member, only livez, readyz, status, metrics, openapi.yaml and the
        UI answer; every other API path answers 503.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Removed:
      description: >-
        The node was removed from the cluster and started fenced. Until its data directory is deleted, only livez,
        readyz, status, metrics, openapi.yaml and the UI answer; every other API path answers 410.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    LoginParams:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    InitializeParams:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          $ref: "#/components/schemas/Password"

    LoginResponse:
      type: object
      required: [message, token]
      properties:
        message:
          type: string
        token:
          type: string
          description: The access token, valid for 15 minutes.

    RefreshResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string

    SuccessResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    Password:
      type: string
      description: 8 to 72 bytes.
      minLength: 8
      maxLength: 72

    RoleID:
      type: integer
      enum: [1, 2, 3, 4]
      description: >-
        1 Admin: everything. 2 Read Only: reads messages, Diameter and settings. 3 Network Manager: also submits
        messages and changes settings and Diameter peers. 4 Submitter: submits messages and reads only those it submitted.

    User:
      type: object
      required: [email, role_id, role_pinned, password_set, oidc_linked]
      properties:
        email:
          type: string
          format: email
        role_id:
          $ref: "#/components/schemas/RoleID"
        role_pinned:
          type: boolean
          description: The role was set by an admin and is not updated from OIDC groups.
        password_set:
          type: boolean
          description: The user can sign in with a password.
        oidc_linked:
          type: boolean
          description: The user is linked to an account at the current identity provider.

    ListUsersResponse:
      type: object
      required: [items, page, per_page, total_count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer

    CreateUserParams:
      type: object
      required: [email, role_id]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          $ref: "#/components/schemas/Password"
          description: Empty or missing for a user who signs in only through OIDC.
        role_id:
          $ref: "#/components/schemas/RoleID"
        role_pinned:
          type: boolean
          description: Keeps the role from being updated from OIDC groups. Missing means false.

    UpdateUserParams:
      type: object
      required: [role_id]
      additionalProperties: false
      properties:
        role_id:
          $ref: "#/components/schemas/RoleID"
        role_pinned:
          type: boolean
          description: Keeps the role from being updated from OIDC groups. Missing keeps the current value.

    UpdatePasswordParams:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password:
          $ref: "#/components/schemas/Password"

    UpdateMyPasswordParams:
      type: object
      required: [current_password, password]
      additionalProperties: false
      properties:
        current_password:
          type: string
        password:
          $ref: "#/components/schemas/Password"

    APIToken:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Absent for a token that does not expire.
        last_used_at:
          type: string
          format: date-time
          description: Absent for a token never used. Updated at most once a minute.

    ListAPITokensResponse:
      type: object
      required: [items, page, per_page, total_count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/APIToken"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer

    CreateAPITokenParams:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 50
        expires_at:
          type: string
          format: date-time
          description: When the token expires. Without it, the token does not expire.

    CreateAPITokenResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The token, ellasmsc_ followed by its ID, an underscore and its secret.

    E164:
      type: string
      pattern: '^\+[1-9][0-9]{0,14}$'
      examples: ["+15551230001"]

    Originator:
      description: >-
        An E.164 number, or a name of 1 to 11 ASCII letters and digits, with single spaces between words, that is not
        all digits (TS 23.040
        clause 9.1.2.5, Type-of-number alphanumeric). A value that starts with + is an E.164 number. A name is
        delivered as given.
      oneOf:
        - $ref: "#/components/schemas/E164"
        - type: string
          pattern: '^(?=.{1,11}$)(?=.*[^0-9])[A-Za-z0-9]+( [A-Za-z0-9]+)*$'
      examples: ["+15551230001", "EllaSMSC"]

    MessageStatus:
      type: string
      description: >-
        replaced: a later message from the same phone, with the same replace type (TS 23.040 clause 9.2.3.9),
        replaced it before its delivery.
      enum: [pending, delivered, failed, expired, replaced]

    StatusReports:
      type: object
      description: >-
        Whether the phone that sent the message asked for status reports (TP-SRR), and the SMS-STATUS-REPORTs the
        SMSC returned to it (TS 23.040 clause 3.2.9). A message submitted through the API never asks for reports.
      required: [requested, reports]
      properties:
        requested:
          type: boolean
        reports:
          type: array
          description: Oldest first.
          items:
            $ref: "#/components/schemas/StatusReport"

    StatusReport:
      type: object
      required: [id, tp_status, tp_status_name, status, created_at, updated_at, expires_at]
      properties:
        id:
          type: integer
          format: int64
        tp_status:
          type: integer
          minimum: 0
          maximum: 255
          description: The TP-Status that the report tells (TS 23.040 clause 9.2.3.15).
        tp_status_name:
          type: string
          description: >-
            The meaning of tp_status in TS 23.040 clause 9.2.3.15; reserved and sc_specific for values the
            specification does not name.
          examples: [received, replaced, no_response, validity_period_expired]
        status:
          type: string
          description: The delivery of the report to the phone.
          enum: [pending, delivered, failed, expired]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        next_attempt_at:
          type: string
          format: date-time

    CreateMessageParams:
      type: object
      description: Exactly one of text and binary.
      required: [from, to]
      properties:
        from:
          $ref: "#/components/schemas/Originator"
        to:
          $ref: "#/components/schemas/E164"
        text:
          type: string
          minLength: 1
        binary:
          $ref: "#/components/schemas/BinaryParams"
        validity_seconds:
          type: integer
          minimum: 1
          maximum: 315360000
          description: How long the SMSC attempts delivery, at most 10 years. Absent, the default validity applies.

    BinaryParams:
      type: object
      description: >-
        One short message whose TPDU parameters the caller codes, such as a (U)SIM data download message (3GPP TS 23.040
        clause 9.2.3.9). The SMSC delivers them unchanged. The user data header and user data together are at most 140
        octets.
      required: [data_coding_scheme, user_data]
      properties:
        protocol_identifier:
          type: integer
          minimum: 0
          maximum: 255
          default: 0
          description: >-
            TP-PID (3GPP TS 23.040 clause 9.2.3.9). Telematic interworking is not supported. (U)SIM data download (127)
            and ANSI-136 R-DATA (124) need a data coding scheme of message class 2. Device triggering (72) needs an
            application port addressing information element in the user data header.
        data_coding_scheme:
          type: integer
          minimum: 0
          maximum: 255
          description: TP-DCS (3GPP TS 23.038 clause 4). It must not code the GSM 7 bit default alphabet or UCS2; send text instead.
        user_data_header:
          allOf:
            - $ref: "#/components/schemas/Octets"
          description: The TP-UDH, its length octet included (3GPP TS 23.040 clause 9.2.3.24). Absent when the user data has no header.
        user_data:
          allOf:
            - $ref: "#/components/schemas/Octets"
          description: The TP-UD that follows the header.

    Octets:
      type: string
      pattern: "^([0-9a-fA-F]{2})*$"
      description: Octets in hexadecimal, two digits each. Responses use lowercase.
      example: "027000"

    CreateMessageResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"

    MessageCounts:
      type: object
      required: [pending, delivered, failed, expired, replaced]
      properties:
        pending:
          type: integer
        delivered:
          type: integer
        failed:
          type: integer
        expired:
          type: integer
        replaced:
          type: integer

    ListMessagesResponse:
      type: object
      required: [items, page, per_page, total_count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer

    ListAttemptsResponse:
      type: object
      required: [items, page, per_page, total_count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Attempt"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer

    Concatenation:
      type: object
      required: [reference, part, total]
      properties:
        reference:
          type: integer
          minimum: 0
          maximum: 65535
        part:
          type: integer
          minimum: 0
          maximum: 255
        total:
          type: integer
          minimum: 0
          maximum: 255

    Message:
      type: object
      required: [id, from, to, encoding, status, created_at, updated_at, expires_at, status_report]
      properties:
        id:
          type: integer
          format: int64
        from:
          type: string
        to:
          $ref: "#/components/schemas/E164"
        encoding:
          type: string
          enum: [gsm7, ucs2, binary]
        concatenation:
          $ref: "#/components/schemas/Concatenation"
        status:
          $ref: "#/components/schemas/MessageStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        next_attempt_at:
          type: string
          format: date-time
        status_report:
          $ref: "#/components/schemas/StatusReports"
        submitted_by:
          type: string
          format: email
          description: >-
            The user that submitted a message over the API or SMPP. A user with the Submitter role reads only the
            messages it submitted.
        system_id:
          type: string
          description: The ESME that submitted a message over SMPP, while it exists.

    MessageContent:
      type: object
      properties:
        text:
          type: string
          description: Absent for a binary message.
        binary:
          $ref: "#/components/schemas/BinaryContent"
        deliver_reports:
          type: array
          description: >-
            The SMS-DELIVER-REPORTs that the recipient answered with, when the serving node passed them on: in the
            RP-ACK of a delivery attempt that succeeded, and in the RP-ERROR of one that failed (3GPP TS 23.040 clause
            9.2.2.1a). Their user data is for the originator, such as a (U)SIM's answer to a (U)SIM data download
            message. Absent when there are none.
          items:
            $ref: "#/components/schemas/DeliverReport"

    BinaryContent:
      type: object
      description: The TPDU parameters of a binary message.
      required: [protocol_identifier, data_coding_scheme, user_data]
      properties:
        protocol_identifier:
          type: integer
          minimum: 0
          maximum: 255
        data_coding_scheme:
          type: integer
          minimum: 0
          maximum: 255
        user_data_header:
          allOf:
            - $ref: "#/components/schemas/Octets"
          description: The TP-UDH, its length octet included. Absent when the user data has no header.
        user_data:
          $ref: "#/components/schemas/Octets"

    DeliverReport:
      type: object
      required: [attempt_id, tpdu]
      properties:
        attempt_id:
          type: integer
          format: int64
          description: The delivery attempt that the recipient answered.
        tpdu:
          allOf:
            - $ref: "#/components/schemas/Octets"
          description: The SMS-DELIVER-REPORT. The other properties are absent when it does not decode.
        protocol_identifier:
          type: integer
          minimum: 0
          maximum: 255
        data_coding_scheme:
          type: integer
          minimum: 0
          maximum: 255
        user_data_header:
          $ref: "#/components/schemas/Octets"
        user_data:
          allOf:
            - $ref: "#/components/schemas/Octets"
          description: Absent when the report has no user data.

    Attempt:
      type: object
      required: [id, started_at, completed_at, step, outcome]
      properties:
        id:
          type: integer
          format: int64
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        step:
          type: string
          enum: [routing, delivery]
        node:
          type: string
        node_type:
          type: string
          enum: [mme, sgsn, ip_sm_gw, smsf_3gpp, smsf_non_3gpp]
        outcome:
          type: string
          enum:
            - success
            - timeout
            - no_hss
            - unreachable
            - diameter_error
            - error
            - user_unknown
            - absent_user
            - user_busy_for_mt_sms
            - facility_not_supported
            - illegal_user
            - illegal_equipment
            - sm_delivery_failure
            - service_not_subscribed
            - service_barred
            - mwd_list_full
        result_code:
          type: integer
          format: uint32
        vendor_id:
          type: integer
          format: uint32
        failure_cause:
          type: string
        tp_failure_cause:
          type: string
        absent_user_diagnostics:
          $ref: "#/components/schemas/AbsentUserDiagnostics"

    AbsentUserDiagnostics:
      type: object
      properties:
        mme:
          type: string
        msc:
          type: string
        sgsn:
          type: string
        ip_sm_gw:
          type: string
        smsf_3gpp:
          type: string
        smsf_non_3gpp:
          type: string

    ReadinessResponse:
      type: object
      required: [result]
      properties:
        result:
          $ref: "#/components/schemas/Readiness"

    Readiness:
      type: object
      required: [ready, checks]
      properties:
        ready:
          type: boolean
          description: Whether every check passes.
        checks:
          type: array
          description: The checks, in the order they run.
          items:
            $ref: "#/components/schemas/ReadinessCheck"

    ReadinessCheck:
      type: object
      required: [name, ok, detail]
      properties:
        name:
          type: string
          enum: [shutdown, member, initialized, diameter_label, drain, consistent, database, leader, caught_up, cluster]
          description: >-
            shutdown: the node is not stopping. member: the node was not removed from the cluster and is not
            forming one. initialized: the node has no cluster section, or its first user exists. diameter_label: the
            cluster has committed this node's member record with the configured Diameter host label; until then
            Diameter stays closed. drain: the node is
            active, not draining or drained. consistent: the leader has not found this node's database to differ from
            its own. database: the database answers. leader: the node leads with an established term, or heard from the
            leader within twice the election timeout. caught_up: the database is at most 1000 log entries behind the
            leader's commit index, learned within the last 3 seconds. cluster: with cluster=true only, every voter is
            healthy in the leader's view.
        ok:
          type: boolean
        detail:
          type: string
          description: Why the check fails. Empty when it passes.
          example: no contact with the cluster leader for 12s

    Status:
      type: object
      required: [version, revision, initialized, clustered, node_id, display_name, diameter_label, diameter_host, label_generated, formation]
      properties:
        formation:
          $ref: "#/components/schemas/Formation"
        initialized:
          type: boolean
          description: Whether the first user exists. Until it does, POST /api/v1/init creates it.
        clustered:
          type: boolean
          description: Whether the node has a cluster address. Until the first user exists, POST /api/v1/cluster/join can join it to a cluster.
        version:
          type: string
          example: v0.0.1
        revision:
          type: string
          description: Git commit the binary was built from. Empty for development builds.
        node_id:
          type: string
          format: uuid
          description: The ID of the node that answered.
        display_name:
          type: string
          description: The answering node's display name. Empty when unset.
        diameter_label:
          type: string
          description: >-
            The first label of the answering node's Diameter host, <label>.node.<realm>: diameter.host_label from its
            configuration file or, when unset, smsc- and the last 12 hex characters of the node ID.
          example: smsc-a
        diameter_host:
          type: string
          description: The answering node's Diameter host, <diameter_label>.node.<realm>.
          example: smsc-a.node.epc.mnc001.mcc001.3gppnetwork.org
        label_generated:
          type: boolean
          description: >-
            Whether diameter_label was generated from the node ID because diameter.host_label is unset. A generated
            host changes when the node is reinstalled.

    DiameterStatus:
      type: object
      required: [host, label_generated, realm, peers, routes]
      properties:
        host:
          type: string
          description: This node's Diameter host, <label>.node.<realm>.
        label_generated:
          type: boolean
          description: Whether the host's first label was generated from the node ID because diameter.host_label is unset.
        realm:
          type: string
        peers:
          type: array
          items:
            $ref: "#/components/schemas/DiameterPeer"
        routes:
          type: array
          items:
            $ref: "#/components/schemas/DiameterRoute"

    DiameterRoute:
      type: object
      required: [realm, default, application, peers]
      properties:
        realm:
          type: string
          description: Empty for a default route.
        default:
          type: boolean
          description: >-
            Whether the route takes the foreign realms that no other route or connected peer serves. It never takes the
            SMSC's own realm.
        application:
          type: string
        peers:
          type: array
          description: Hosts of the open peers that can serve this route.
          items:
            type: string

    OperatorSettings:
      type: object
      additionalProperties: false
      required: [mcc, mnc, service_centre_address, numbering]
      properties:
        mcc:
          type: string
          pattern: "^[0-9]{3}$"
          example: "001"
        mnc:
          type: string
          pattern: "^[0-9]{2,3}$"
          description: Together with mcc, sets the Diameter realm epc.mnc<MNC>.mcc<MCC>.3gppnetwork.org and each node's host <diameter_label>.node.<realm>.
          example: "01"
        service_centre_address:
          $ref: "#/components/schemas/E164"
        numbering:
          type: object
          additionalProperties: false
          required: [country_code, national_prefix, international_prefix]
          properties:
            country_code:
              type: string
              pattern: "^[1-9][0-9]{0,2}$"
              example: "1"
            national_prefix:
              type: string
              pattern: "^[0-9]{0,4}$"
              example: "1"
            international_prefix:
              type: string
              pattern: "^[0-9]{0,4}$"
              description: Must differ from national_prefix when both are set.
              example: "011"

    RetentionSettings:
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days:
          type: integer
          format: int64
          minimum: 1
          description: How long a message is kept once it has its final status, with its status reports and delivery attempts.
          example: 30

    OIDCGroupRole:
      type: object
      required: [group, role_id]
      additionalProperties: false
      properties:
        group:
          type: string
          minLength: 1
          maxLength: 255
          description: A value of the groups claim, matched exactly.
        role_id:
          $ref: "#/components/schemas/RoleID"

    OIDCSettings:
      type: object
      required: [enabled, external_url, redirect_url, issuer, client_id, client_secret_set, display_name, scopes,
        session_lifetime_seconds, trust_unverified_email, ca_certificate, groups_claim, group_roles]
      properties:
        enabled:
          type: boolean
        external_url:
          type: string
          description: The https URL users reach Ella SMSC at.
          example: https://smsc.example.com
        redirect_url:
          type: string
          description: The redirect URL to register with the identity provider. Empty without an external URL.
          example: https://smsc.example.com/api/v1/auth/oidc/callback
        issuer:
          type: string
          example: https://idp.example.com/realms/smsc
        client_id:
          type: string
        client_secret_set:
          type: boolean
        display_name:
          type: string
          description: The name on the login button.
          example: Keycloak
        scopes:
          type: array
          items:
            type: string
          example: [openid, email, profile]
        session_lifetime_seconds:
          type: integer
          format: int64
        trust_unverified_email:
          type: boolean
          description: >-
            Links accounts by email when the provider does not send email_verified. An email_verified of false is
            always refused.
        ca_certificate:
          type: string
          description: PEM certificates that the provider's TLS certificate must chain to. Empty uses the system's.
        groups_claim:
          type: string
          example: groups
        group_roles:
          type: array
          description: In order. The first group the user is in gives the role.
          items:
            $ref: "#/components/schemas/OIDCGroupRole"

    UpdateOIDCParams:
      type: object
      required: [enabled, scopes, session_lifetime_seconds]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        external_url:
          type: string
          description: An https URL with no path. Stored as scheme://host[:port]. Required when enabled.
        issuer:
          type: string
          description: An https URL with no query or fragment, exactly as the provider names itself. Required when enabled.
        client_id:
          type: string
          maxLength: 255
        client_secret:
          type: string
          maxLength: 255
          description: >-
            Write-only. Empty or missing keeps the current secret. Required when the issuer or the client ID
            changes.
        display_name:
          type: string
          maxLength: 64
        scopes:
          type: array
          maxItems: 20
          description: Must include openid and email.
          items:
            type: string
        session_lifetime_seconds:
          type: integer
          format: int64
          minimum: 300
          maximum: 2592000
        trust_unverified_email:
          type: boolean
        ca_certificate:
          type: string
        groups_claim:
          type: string
          maxLength: 255
          description: Required with group_roles.
        group_roles:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/OIDCGroupRole"

    DiscoverOIDCParams:
      type: object
      required: [issuer]
      additionalProperties: false
      properties:
        issuer:
          type: string
        ca_certificate:
          type: string

    OIDCDiscovery:
      type: object
      required: [issuer, authorization_endpoint, token_endpoint, userinfo_endpoint, jwks_uri, signing_algorithms,
        token_endpoint_auth_method, keys, pkce, issuer_parameter]
      properties:
        issuer:
          type: string
        authorization_endpoint:
          type: string
        token_endpoint:
          type: string
        userinfo_endpoint:
          type: string
          description: Empty when the provider has none.
        jwks_uri:
          type: string
        token_endpoint_auth_method:
          type: string
          enum: [client_secret_basic, client_secret_post]
          description: How Ella SMSC sends the client secret to the token endpoint.
        signing_algorithms:
          type: array
          description: The asymmetric algorithms the provider signs ID tokens with.
          items:
            type: string
        keys:
          type: integer
          description: The number of public signing keys.
        pkce:
          type: boolean
          description: The provider advertises PKCE with S256.
        issuer_parameter:
          type: boolean
          description: The provider sends the iss parameter in authorization responses (RFC 9207).

    DeliverySettings:
      type: object
      additionalProperties: false
      required: [default_validity_seconds, retry_intervals_seconds]
      properties:
        default_validity_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 315360000
          description: How long delivery of a message without its own validity period is attempted, at most 10 years.
          example: 604800
        retry_intervals_seconds:
          type: array
          description: Wait before each retry. The last interval repeats. Empty means a failed delivery is not retried.
          items:
            type: integer
            format: int64
            minimum: 1
          example: [60, 300, 900, 3600]

    DiameterPeer:
      type: object
      required: [configured, host, realm, address, state, applications, since]
      properties:
        id:
          type: integer
          format: int64
          description: The ID of a configured peer. Absent for a peer that connected to the SMSC.
        configured:
          type: boolean
        host:
          type: string
        realm:
          type: string
        address:
          type: string
        state:
          type: string
          enum: [down, connecting, open, suspect, reopen, closing]
        applications:
          type: array
          items:
            type: string
        since:
          type: string
          format: date-time
        error:
          type: string
          description: Why the last connection to the peer failed or closed.
    Formation:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [forming, joining, member, removed]
          description: >-
            forming: the node has no cluster data and waits for the nodes behind cluster.join. joining: it joins a
            member it found. member: it is a cluster member. removed: it was removed from the cluster and is fenced
            until its data directory is deleted.
        expected:
          type: integer
          description: cluster.bootstrap_expect. Absent when unset.
        found:
          type: integer
          description: While forming, the forming nodes found, this one included.
        detail:
          type: string
          description: What the node waits for, or why it does not form.
          example: found 2 of 3 nodes
    ClusterStatus:
      type: object
      required: [node_id, cluster_id, clustered, term, applied_index, commit_index, schema, members]
      properties:
        node_id:
          type: string
          format: uuid
          description: The node that answered.
        cluster_id:
          type: string
          format: uuid
        clustered:
          type: boolean
          description: Whether the node has a cluster address.
        leader_id:
          type: string
          format: uuid
        term:
          type: integer
          format: int64
        applied_index:
          type: integer
          format: int64
        commit_index:
          type: integer
          format: int64
        schema:
          type: integer
          description: Database schema version of the cluster.
        healthy:
          type: boolean
        failure_tolerance:
          type: integer
          description: How many voters can fail without stopping writes.
        members:
          type: array
          items:
            $ref: "#/components/schemas/ClusterMember"
    ClusterMember:
      type: object
      required: [node_id, address, diameter_label, diameter_host, label_generated, display_name, version, joined_at, drain_state, suffrage, leader]
      properties:
        node_id:
          type: string
          format: uuid
        address:
          type: string
          description: The cluster address, host:port. Empty for a node without one.
        diameter_label:
          type: string
          description: >-
            The first label of the member's Diameter host, <label>.node.<realm>: diameter.host_label from its
            configuration file or, when unset, smsc- and the last 12 hex characters of the node ID. Unique among
            members.
          example: smsc-a
        diameter_host:
          type: string
          description: The member's Diameter host, <diameter_label>.node.<realm>.
          example: smsc-a.node.epc.mnc001.mcc001.3gppnetwork.org
        label_generated:
          type: boolean
          description: Whether diameter_label was generated from the node ID because diameter.host_label is unset.
        display_name:
          type: string
          description: Name set by the operator. Empty when unset.
        version:
          type: string
        joined_at:
          type: string
          format: date-time
        drain_state:
          type: string
          enum: [active, draining, drained]
        suffrage:
          type: string
          enum: [voter, nonvoter, none]
        leader:
          type: boolean
        healthy:
          type: boolean
        last_contact:
          type: string
          description: Time since the leader last heard from the member, as a Go duration.
        applied_index:
          type: integer
          format: int64
        diverged:
          type: boolean
          description: The member's database differs from the leader's.
    CreateJoinTokenParams:
      type: object
      properties:
        ttl_seconds:
          type: integer
          minimum: 300
          maximum: 86400
          description: How long the token is valid. Default 1800.
    JoinToken:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
    JoinClusterParams:
      type: object
      required: [token]
      properties:
        token:
          type: string
    UpdateMemberParams:
      type: object
      required: [display_name]
      properties:
        display_name:
          type: string
          maxLength: 63
          description: Up to 63 bytes. Empty clears it.
