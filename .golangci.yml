version: "2"
linters:
  enable:
    - asciicheck
    - bodyclose
    - dogsled
    - godox
    - gomodguard
    - misspell
    - nakedret
    - noctx
    - predeclared
    - sloglint
    - staticcheck
    - unconvert
    - unparam
    - whitespace
    - govet
    - wsl_v5
  settings:
    sloglint:
      # A log made where a context is in scope takes it, so that it carries the trace context of its span.
      context: scope
issues:
  new-from-rev: ""
  new: false
severity:
  default: error
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
