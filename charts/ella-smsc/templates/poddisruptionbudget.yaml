{{- if include "ella-smsc.ha" . }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ella-smsc.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ella-smsc.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "ella-smsc.selectorLabels" . | nindent 6 }}
{{- end }}
