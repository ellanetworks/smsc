apiVersion: v1
kind: Service
metadata:
  name: {{ include "ella-smsc.headlessServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ella-smsc.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "ella-smsc.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: 5010
      targetPort: http
    {{- if not .Values.diameter.networkAttachment.enabled }}
    - name: sctp-diameter
      protocol: SCTP
      port: 3868
      targetPort: sctp-diameter
    {{- end }}
    {{- if include "ella-smsc.ha" . }}
    - name: tcp-cluster
      protocol: TCP
      port: 7000
      targetPort: tcp-cluster
    {{- end }}
