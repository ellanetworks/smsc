{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ella-smsc.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ella-smsc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ella-smsc.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- if include "ella-smsc.ha" . }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "ella-smsc.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: tcp-cluster
    {{- end }}
    - ports:
        - protocol: TCP
          port: http
        - protocol: SCTP
          port: sctp-diameter
        {{- if .Values.smpp.enabled }}
        - protocol: TCP
          port: tcp-smpp
        {{- end }}
{{- end }}
